# IRONVOW — Nginx in front of PM2.
#
# The API and the client are served from one origin so the session cookie is
# same-site: a cross-origin setup would need SameSite=None, which means giving
# up the CSRF protection that Lax provides for free.

upstream ironvow_api { server 127.0.0.1:4000; keepalive 32; }
upstream ironvow_web { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 443 ssl http2;
  server_name ironvow.example.com;

  ssl_certificate     /etc/letsencrypt/live/ironvow.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ironvow.example.com/privkey.pem;

  # Procedural art means no image payloads; what is left is JS and JSON.
  gzip on;
  gzip_types application/javascript application/json text/css;
  gzip_min_length 1024;

  client_max_body_size 256k;

  location /api/ {
    proxy_pass http://ironvow_api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # A raid submission carries a few hundred deploy commands at most.
    proxy_read_timeout 30s;
  }

  # Hashed build output never changes under its own name.
  location /_next/static/ {
    proxy_pass http://ironvow_web;
    proxy_cache_valid 200 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://ironvow_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}

server {
  listen 80;
  server_name ironvow.example.com;
  return 301 https://$host$request_uri;
}
