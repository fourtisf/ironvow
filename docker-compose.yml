# IRONVOW, running.
#
#   cp .env.docker.example .env
#   docker compose up --build
#   open http://localhost:3000
#
# That is the whole thing: Postgres, Redis, the API, the worker and the web app.
# Nobody has played this game yet, including the person who commissioned it,
# and every balance number in it is a guess until somebody does.

name: ironvow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ironvow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironvow}
      POSTGRES_DB: ${POSTGRES_DB:-ironvow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API runs migrations the moment it starts, so it must not start
      # before the database can answer.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ironvow} -d ${POSTGRES_DB:-ironvow}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-ironvow}:${POSTGRES_PASSWORD:-ironvow}@postgres:5432/${POSTGRES_DB:-ironvow}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env — 32+ random bytes}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # off: no login email at all, guest play only, until SMTP is configured.
      # NOT console — the API refuses to start in production with console mail,
      # and the first deployment crash-looped on exactly that for an hour.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-off}
      # The door. Nobody plays without typing this. Blank it to open the game.
      ACCESS_CODE: ${ACCESS_CODE-1010}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OPS_TOKEN: ${OPS_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    ports:
      # Loopback only. The browser never talks to the API directly — it goes
      # through the web container's /api rewrite — so on a public VPS there is
      # no reason for port 4000 to face the internet.
      - '127.0.0.1:${API_PORT:-4000}:4000'
    healthcheck:
      # `docker compose ps` should say "unhealthy" when the API is not
      # answering, rather than "Started" — which is what it said while the
      # first deployment was crash-looping.
      # Node's own fetch: the slim Debian image ships neither wget nor curl,
      # and installing one just to ask "are you up" is a bigger surface than
      # the question deserves.
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      # After the API is answering, which is also after it has applied the
      # migrations.
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ironvow}:${POSTGRES_PASSWORD:-ironvow}@postgres:5432/${POSTGRES_DB:-ironvow}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-off}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}

  web:
    build:
      context: .
      target: web
      args:
        # Same-origin: the browser calls /api/... and Next rewrites it to the
        # API container. One origin means no CORS to configure and no second
        # hostname to buy. Both are build arguments because Next bakes both in.
        NEXT_PUBLIC_API_URL: /api
        API_PROXY_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      NODE_ENV: production
    ports:
      # Loopback only: a reverse proxy on the host (deploy/Caddyfile) is what
      # answers on 80 and 443, and it is the thing that holds the certificate.
      - '127.0.0.1:${WEB_PORT:-3000}:3000'

volumes:
  pgdata:
