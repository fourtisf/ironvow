/* ============ battle state ============ */
const BT = {
  on:false, kind:'raid', structs:[], units:[], projs:[], fx:[],
  time:180, avail:{}, sel:null, totalHp:1, killedHp:0, stars:0,
  loot:{g:0,i:0}, pool:{g:0,i:0}, ended:false, wallSet:new Set(), deployed:0
};

function enemyLoot(stage){
  return { g: Math.round(420 + stage * 300 + Math.pow(stage, 1.5) * 40),
           i: Math.round(130 + stage * 110 + Math.pow(stage, 1.4) * 18) };
}

function genEnemy(stage){
  const r = mulberry(9001 + stage * 7919);
  const lv = clamp(1 + Math.floor(stage / 2), 1, 9);
  const out = [], mid = Math.floor(N/2) - 1;
  const put = (t, gx, gy, l) => {
    const s = TYPES[t].s;
    if (gx < IN0 || gy < IN0 || gx + s > IN1 || gy + s > IN1) return false;
    for (const b of out){ const bs = TYPES[b.t].s;
      if (gx < b.gx + bs && gx + s > b.gx && gy < b.gy + bs && gy + s > b.gy) return false; }
    out.push({ id: out.length + 1, t, gx, gy, lv: clamp(l || lv, 1, 9) });
    return true;
  };
  put('keep', mid, mid, lv);
  // defensive ring
  const dn = clamp(1 + Math.floor(stage / 2), 1, 6);
  for (let i = 0; i < dn; i++){
    const a = (i / dn) * 6.283 + r();
    put('cannon', Math.round(mid + 1 + Math.cos(a) * 4.6), Math.round(mid + 1 + Math.sin(a) * 4.6), lv);
  }
  const tn = stage >= 3 ? clamp(Math.floor(stage / 3), 1, 5) : 0;
  for (let i = 0; i < tn; i++){
    const a = (i / Math.max(1,tn)) * 6.283 + 0.8 + r();
    put('tower', Math.round(mid + 1 + Math.cos(a) * 6.6), Math.round(mid + 1 + Math.sin(a) * 6.6), lv);
  }
  // economy buildings hold the loot
  const mn = clamp(2 + Math.floor(stage / 3), 2, 6);
  for (let i = 0; i < mn; i++){
    const a = (i / mn) * 6.283 + 2.1;
    put('mine', Math.round(mid + 1 + Math.cos(a) * 7.4), Math.round(mid + 1 + Math.sin(a) * 7.4), lv);
  }
  if (stage >= 2) for (let i = 0; i < clamp(Math.floor(stage/3), 1, 4); i++){
    const a = (i / 3) * 6.283 + 4.0;
    put('forge', Math.round(mid + 1 + Math.cos(a) * 8.2), Math.round(mid + 1 + Math.sin(a) * 8.2), lv);
  }
  // rampart ring
  const wr = 3.1, wn = Math.min(8 + stage * 3, 44);
  for (let i = 0; i < wn; i++){
    const a = (i / wn) * 6.283;
    put('wall', Math.round(mid + 1 + Math.cos(a) * wr), Math.round(mid + 1 + Math.sin(a) * wr), lv);
  }
  return out;
}

function toStructs(list, loot){
  const eco = list.filter(b => b.t !== 'wall');
  const share = eco.length || 1;
  return list.map(b => {
    const mx = hpOf(b.t, b.lv);
    return { id: b.id, t: b.t, gx: b.gx, gy: b.gy, lv: b.lv, hp: mx, maxHp: mx, dead: false,
      loot: b.t === 'wall' ? { g:0, i:0 } : { g: loot.g / share, i: loot.i / share },
      cd: 0, aim: -0.5, recoil: 0 };
  });
}

function rebuildWallSet(){
  BT.wallSet.clear();
  BT.structs.forEach(s => { if (s.t === 'wall' && !s.dead) BT.wallSet.add(s.gx + ',' + s.gy); });
}

/* ============ start / end ============ */
function startRaid(){
  if (armyUsed() === 0){ toast('Train troops in ARMY before you raid'); sfx.bad(); return; }
  closeSheet(); deselect();
  const stage = ST.stage;
  BT.kind = 'raid';
  BT.pool = enemyLoot(stage);
  BT.structs = toStructs(genEnemy(stage), BT.pool);
  BT.avail = Object.assign({}, ST.army);
  begin(180);
}

function startDefend(){
  closeSheet(); deselect();
  BT.kind = 'defend';
  BT.pool = { g:0, i:0 };
  BT.structs = toStructs(ST.buildings.map(b => ({ id:b.id, t:b.t, gx:b.gx, gy:b.gy, lv:b.lv })), { g:0, i:0 });
  BT.avail = Object.assign({}, ST.army);
  begin(140);
  // AI attackers spawn on the rim
  const stage = ST.stage, r = mulberry(4242 + stage * 331);
  const n = clamp(4 + Math.floor(stage * 1.6), 4, 22), mid = N/2;
  for (let i = 0; i < n; i++){
    const a = (i / n) * 6.283 + r() * 0.4, rad = 10.5;
    const t = r() < 0.2 && stage >= 3 ? 'lancer' : r() < 0.28 ? 'archer' : 'raider';
    spawnUnit(t, mid + Math.cos(a) * rad, mid + Math.sin(a) * rad, 'atk', 1 + stage * 0.06);
  }
}

function begin(secs){
  BT.on = true; BT.ended = false; BT.units = []; BT.projs = []; BT.fx = [];
  BT.time = secs; BT.killedHp = 0; BT.stars = 0; BT.loot = { g:0, i:0 }; BT.deployed = 0;
  BT.totalHp = BT.structs.reduce((a, s) => a + s.maxHp, 0) || 1;
  BT.sel = ['raider','archer','lancer','ram'].find(k => (BT.avail[k] || 0) > 0) || null;
  rebuildWallSet();
  mode = 'battle';
  $('hud').classList.add('hide'); $('btHud').classList.remove('hide');
  $('insp').classList.add('hide'); $('placeBar').classList.add('hide');
  centerOn(N/2, N/2, 0.95);
  renderTray(); updateBtHud();
  toast(BT.kind === 'raid' ? 'Tap open ground to send troops in' : 'Hold the line — your defences are firing');
}

function endBattle(){
  if (BT.ended) return;
  BT.ended = true; BT.on = false;
  const pct = clamp(BT.killedHp / BT.totalHp, 0, 1);
  const keepDead = !BT.structs.some(s => s.t === 'keep' && !s.dead);
  let stars = 0;
  if (pct >= 0.5) stars++;
  if (keepDead) stars++;
  if (pct >= 0.999) stars++;
  BT.stars = stars;

  // spent troops do not come back
  for (const k in ST.army) ST.army[k] = BT.avail[k] || 0;

  mode = 'base';
  $('btHud').classList.add('hide'); $('hud').classList.remove('hide');

  if (BT.kind === 'raid'){
    ST.raids++;
    const won = stars >= 1;
    if (won) ST.wins++;
    if (stars === 3) ST.threeStars = (ST.threeStars || 0) + 1;
    const tro = won ? (12 + Math.floor(ST.stage * 0.8)) * stars : -Math.floor(6 + ST.stage * 0.4);
    ST.trophy = Math.max(0, ST.trophy + tro);
    gain(Math.floor(BT.loot.g), Math.floor(BT.loot.i));
    if (won) ST.stage++;
    save(); syncHud();
    showResult(stars, BT.loot, tro, won);
    if (won) sfx.win(); else sfx.bad();
  } else {
    // defending: attackers still standing sack your stores
    const alive = BT.units.filter(u => u.side === 'atk' && !u.dead).length;
    const held = alive === 0;
    const lost = held ? { g:0, i:0 }
      : { g: Math.floor(ST.gold * Math.min(0.28, alive * 0.035)), i: Math.floor(ST.iron * Math.min(0.28, alive * 0.035)) };
    ST.gold -= lost.g; ST.iron -= lost.i;
    ST.trophy = Math.max(0, ST.trophy + (held ? 10 : -8));
    save(); syncHud();
    showDefendResult(held, lost, alive);
    if (held) sfx.win(); else sfx.bad();
  }
}

/* ============ units ============ */
function spawnUnit(t, x, y, side, scale){
  const d = TROOP[t], k = scale || 1;
  BT.units.push({ t, x, y, side, hp: d.hp * k, maxHp: d.hp * k, dmg: d.dmg * k,
    tgt: null, tgtU: null, cd: 0, dead: false, sw: 0, face: 1, born: T });
}

function deployAt(sx, sy){
  if (!BT.sel || (BT.avail[BT.sel] || 0) <= 0){ toast('Pick a troop first'); return; }
  const [gx, gy] = s2g(sx, sy);
  if (gx < 1.5 || gy < 1.5 || gx > N - 1.5 || gy > N - 1.5){ toast('Too far out'); return; }
  for (const s of BT.structs){
    if (s.dead) continue;
    const sz = TYPES[s.t].s;
    if (dist(gx, gy, s.gx + sz/2, s.gy + sz/2) < sz/2 + 1.6){ toast('Too close to their buildings'); sfx.bad(); return; }
  }
  BT.avail[BT.sel]--;
  spawnUnit(BT.sel, gx, gy, BT.kind === 'raid' ? 'atk' : 'def', 1);
  BT.deployed++;
  BT.fx.push({ k:'ring', x:gx, y:gy, t:0 });
  sfx.tap();
  if ((BT.avail[BT.sel] || 0) <= 0){
    BT.sel = ['raider','archer','lancer','ram'].find(k => (BT.avail[k] || 0) > 0) || null;
  }
  renderTray();
}

function pickTarget(u){
  const pref = TROOP[u.t].pref;
  let best = null, bd = 1e9;
  for (const s of BT.structs){
    if (s.dead) continue;
    if (pref === 'def' && TYPES[s.t].cat !== 'def') continue;
    if (pref === 'wall' && s.t !== 'wall' && best) continue;
    const sz = TYPES[s.t].s;
    const d = dist(u.x, u.y, s.gx + sz/2, s.gy + sz/2);
    const w = pref === 'wall' && s.t === 'wall' ? d * 0.55 : d;
    if (w < bd){ bd = w; best = s; }
  }
  if (!best){
    for (const s of BT.structs){
      if (s.dead) continue;
      const sz = TYPES[s.t].s, d = dist(u.x, u.y, s.gx + sz/2, s.gy + sz/2);
      if (d < bd){ bd = d; best = s; }
    }
  }
  u.tgt = best;
}
function pickEnemyUnit(u){
  let best = null, bd = 1e9;
  for (const o of BT.units){
    if (o.dead || o.side === u.side) continue;
    const d = dist(u.x, u.y, o.x, o.y);
    if (d < bd){ bd = d; best = o; }
  }
  u.tgtU = best; return bd;
}

function damageStruct(s, dmg){
  if (s.dead) return;
  s.hp -= dmg; s.flash = 0.12;
  if (s.hp <= 0){
    s.dead = true; BT.killedHp += s.maxHp;
    BT.loot.g += s.loot.g; BT.loot.i += s.loot.i;
    const sz = TYPES[s.t].s;
    BT.fx.push({ k:'boom', x: s.gx + sz/2, y: s.gy + sz/2, t:0, s: sz });
    if (s.t === 'wall') rebuildWallSet();
    sfx.boom();
    updateBtHud();
  }
}

function updateBattle(dt){
  BT.time -= dt;
  for (const s of BT.structs) if (s.flash) s.flash = Math.max(0, s.flash - dt);
  // --- units ---
  for (const u of BT.units){
    if (u.dead) continue;
    const d = TROOP[u.t];
    if (u.side === 'def'){
      // defenders hunt the attacking units
      const du = pickEnemyUnit(u);
      if (u.tgtU && !u.tgtU.dead){
        if (du <= d.rng + 0.35){
          u.mv = false; u.cd -= dt;
          if (u.cd <= 0){ u.cd = d.cd; u.sw = 1; hurtUnit(u.tgtU, u.dmg); }
        } else {
          const a = Math.atan2(u.tgtU.y - u.y, u.tgtU.x - u.x);
          u.x += Math.cos(a) * d.spd * dt; u.y += Math.sin(a) * d.spd * dt;
          u.face = Math.cos(a) - Math.sin(a) > 0 ? 1 : -1; u.mv = true;
        }
        continue;
      }
    }
    if (!u.tgt || u.tgt.dead) pickTarget(u);
    if (!u.tgt) continue;
    const sz = TYPES[u.tgt.t].s;
    const cx = u.tgt.gx + sz/2, cy = u.tgt.gy + sz/2;
    const gap = dist(u.x, u.y, cx, cy) - sz * 0.5;
    if (gap <= d.rng){
      u.mv = false; u.cd -= dt;
      if (u.cd <= 0){
        u.cd = d.cd; u.sw = 1;
        if (d.rng > 2){ BT.projs.push({ x:u.x, y:u.y, tx:cx, ty:cy, s:6.5, dmg:u.dmg, k:'arrow', tgt:u.tgt }); }
        else { damageStruct(u.tgt, u.dmg); sfx.hit(); }
      }
    } else {
      const a = Math.atan2(cy - u.y, cx - u.x);
      let nx = u.x + Math.cos(a) * d.spd * dt, ny = u.y + Math.sin(a) * d.spd * dt;
      // ramparts physically stop you
      const key = Math.floor(nx) + ',' + Math.floor(ny);
      if (BT.wallSet.has(key) && u.tgt.t !== 'wall'){
        const wall = BT.structs.find(s => !s.dead && s.t === 'wall' && s.gx === Math.floor(nx) && s.gy === Math.floor(ny));
        if (wall) u.tgt = wall;
      } else { u.x = nx; u.y = ny; u.mv = true; }
      u.face = Math.cos(a) - Math.sin(a) > 0 ? 1 : -1;
    }
    u.sw = Math.max(0, u.sw - dt * 4);
  }

  // --- defensive structures shoot ---
  for (const s of BT.structs){
    if (s.dead || !DEF_STAT[s.t]) continue;
    if (s.recoil) s.recoil = Math.max(0, s.recoil - dt * 4);
    const st = DEF_STAT[s.t](s.lv), sz = TYPES[s.t].s;
    const cx = s.gx + sz/2, cy = s.gy + sz/2;
    let best = null, bd = 1e9;
    for (const u of BT.units){
      if (u.dead || u.side === (BT.kind === 'raid' ? 'def' : 'def')) continue;
      if (u.side !== 'atk') continue;
      const d = dist(cx, cy, u.x, u.y);
      if (d < bd){ bd = d; best = u; }
    }
    s.cd -= dt;
    if (best && bd <= st.rng){
      const sx = isoX(best.x, best.y) - isoX(cx, cy), sy = isoY(best.x, best.y) - isoY(cx, cy);
      s.aim = Math.atan2(sy, sx);
      if (s.cd <= 0){
        s.cd = st.cd; s.recoil = 1;
        BT.projs.push({ x:cx, y:cy, tx:best.x, ty:best.y, s: s.t === 'cannon' ? 7 : 11,
          dmg: st.dmg, k: s.t === 'cannon' ? 'ball' : 'arrow', unit: best });
        sfx.hit();
      }
    }
  }

  // --- projectiles ---
  for (let i = BT.projs.length - 1; i >= 0; i--){
    const p = BT.projs[i];
    const a = Math.atan2(p.ty - p.y, p.tx - p.x);
    p.x += Math.cos(a) * p.s * dt; p.y += Math.sin(a) * p.s * dt;
    if (p.unit && !p.unit.dead){ p.tx = p.unit.x; p.ty = p.unit.y; }
    if (dist(p.x, p.y, p.tx, p.ty) < 0.35){
      if (p.unit) hurtUnit(p.unit, p.dmg);
      else if (p.tgt) damageStruct(p.tgt, p.dmg);
      BT.fx.push({ k:'spark', x:p.tx, y:p.ty, t:0 });
      BT.projs.splice(i, 1);
    } else if (p.x < -4 || p.y < -4 || p.x > N+4 || p.y > N+4) BT.projs.splice(i, 1);
  }

  // --- fx ---
  for (let i = BT.fx.length - 1; i >= 0; i--){
    BT.fx[i].t += dt;
    if (BT.fx[i].t > (BT.fx[i].k === 'boom' ? 0.75 : 0.4)) BT.fx.splice(i, 1);
  }

  updateDmgBar();

  // --- end conditions ---
  const left = Object.values(BT.avail).reduce((a, b) => a + b, 0);
  const aliveMine = BT.units.some(u => !u.dead && u.side === (BT.kind === 'raid' ? 'atk' : 'def'));
  if (BT.kind === 'raid'){
    if (!BT.structs.some(s => !s.dead)) return endBattle();
    if (BT.time <= 0) return endBattle();
    if (BT.deployed > 0 && left === 0 && !aliveMine) return endBattle();
  } else {
    if (!BT.units.some(u => !u.dead && u.side === 'atk')) return endBattle();
    if (BT.time <= 0) return endBattle();
    if (!BT.structs.some(s => !s.dead && s.t === 'keep')) return endBattle();
  }
}

function hurtUnit(u, dmg){
  if (u.dead) return;
  u.hp -= dmg; u.flash = 0.12;
  if (u.hp <= 0){ u.dead = true; BT.fx.push({ k:'spark', x:u.x, y:u.y, t:0 }); }
}

/* ============ battle rendering ============ */
function drawUnit(u){
  const z = cam.z, d = TROOP[u.t];
  const [sx, sy] = w2s(isoX(u.x, u.y), isoY(u.x, u.y));
  const S = (u.t === 'ram' ? 1.5 : 1) * 2.0 * z;
  const mine = (BT.kind === 'raid') ? u.side === 'atk' : u.side === 'def';
  const team = mine ? '#3f7fd6' : '#c2412d';
  const teamL = mine ? '#6ba4f0' : '#e0684f';
  const f = u.face || 1;
  const walk = u.mv ? Math.sin(T * 11 + u.born * 7) : 0;
  const bob = u.mv ? Math.abs(Math.sin(T * 11 + u.born * 7)) * 1.1 * S : 0;
  const flash = u.flash > 0;
  if (u.flash) u.flash = Math.max(0, u.flash - 0.025);
  const P = (col) => flash ? '#ffd8c2' : col;

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const LW = Math.max(1.4, 2.1 * S);

  // ground shadow + allegiance ring
  ctx.fillStyle = 'rgba(20,40,18,.3)';
  ctx.beginPath(); ctx.ellipse(sx, sy + 1.5 * z, 8.5 * S, 4 * S, 0, 0, 6.29); ctx.fill();
  ctx.strokeStyle = teamL; ctx.lineWidth = Math.max(1.5, 1.5 * S);
  ctx.beginPath(); ctx.ellipse(sx, sy + 1.5 * z, 8 * S, 3.6 * S, 0, 0, 6.29); ctx.stroke();

  const Y = (v) => sy - v * S - bob;
  ctx.strokeStyle = C.line; ctx.lineWidth = LW;

  if (u.t === 'ram'){
    // wheeled battering ram with a crew of two
    ctx.fillStyle = P('#7a4f28');
    ctx.beginPath(); roundRect(sx - 15 * S, Y(15), 30 * S, 9 * S, 3 * S); ctx.fill(); ctx.stroke();
    ctx.fillStyle = P(C.wood);
    ctx.beginPath(); roundRect(sx - 17 * S, Y(11), 34 * S, 8 * S, 3.5 * S); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3f4a56';
    ctx.beginPath(); ctx.arc(sx + 17 * S * f, Y(15), 4 * S, 0, 6.29); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2b3440';
    [-8, 8].forEach(o => { ctx.beginPath(); ctx.arc(sx + o * S, Y(2.5), 3.6 * S, 0, 6.29); ctx.fill(); ctx.stroke(); });
    ctx.fillStyle = P(team);
    [-9, 7].forEach(o => {
      ctx.beginPath(); roundRect(sx + o * S, Y(24), 6.5 * S, 9 * S, 2.5 * S); ctx.fill(); ctx.stroke();
      ctx.fillStyle = P('#e0b88f');
      ctx.beginPath(); ctx.arc(sx + (o + 3.2) * S, Y(27), 3.6 * S, 0, 6.29); ctx.fill(); ctx.stroke();
      ctx.fillStyle = P(team);
    });
  } else {
    // legs
    ctx.strokeStyle = C.line; ctx.fillStyle = P('#4a5462');
    [walk, -walk].forEach((w, i) => {
      ctx.save(); ctx.translate(sx + (i ? 3 : -3) * S, Y(9));
      ctx.rotate(w * 0.42 * f);
      ctx.beginPath(); roundRect(-2.4 * S, 0, 4.8 * S, 10 * S, 2.2 * S); ctx.fill(); ctx.stroke();
      ctx.restore();
    });
    // tunic
    ctx.fillStyle = P(d.col2);
    ctx.beginPath(); roundRect(sx - 7 * S, Y(23), 14 * S, 15 * S, 4.5 * S); ctx.fill(); ctx.stroke();
    // team sash across the chest
    ctx.fillStyle = P(team);
    ctx.beginPath(); roundRect(sx - 7 * S, Y(18), 14 * S, 4.5 * S, 2 * S); ctx.fill();
    ctx.strokeStyle = C.line; ctx.stroke();
    // pauldron
    ctx.fillStyle = P(d.col);
    ctx.beginPath(); ctx.ellipse(sx - 7.5 * S * f, Y(22), 4.2 * S, 3.4 * S, 0, 0, 6.29); ctx.fill(); ctx.stroke();
    // head + helm
    ctx.fillStyle = P('#e6bd93');
    ctx.beginPath(); ctx.arc(sx, Y(28.5), 5.4 * S, 0, 6.29); ctx.fill(); ctx.stroke();
    ctx.fillStyle = P(u.t === 'archer' ? '#3f7a44' : '#9aa7b4');
    ctx.beginPath(); ctx.arc(sx, Y(29.5), 5.8 * S, Math.PI * 1.03, Math.PI * 2.02); ctx.fill(); ctx.stroke();
    if (u.t === 'lancer'){
      ctx.fillStyle = P(team);
      ctx.beginPath(); roundRect(sx - 1.6 * S, Y(38), 3.2 * S, 6 * S, 1.4 * S); ctx.fill(); ctx.stroke();
    }
    // weapons
    const sw = u.sw;
    if (u.t === 'raider'){
      ctx.save(); ctx.translate(sx + 7 * S * f, Y(20)); ctx.rotate((-0.7 + sw * 1.5) * f);
      ctx.fillStyle = P('#cfdae6');
      ctx.beginPath(); roundRect(0, -1.8 * S, 17 * S, 3.6 * S, 1.6 * S); ctx.fill(); ctx.stroke();
      ctx.fillStyle = P(C.woodD);
      ctx.beginPath(); roundRect(-4.5 * S, -2.4 * S, 5 * S, 4.8 * S, 2 * S); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = P(team); ctx.strokeStyle = C.line;
      ctx.beginPath(); ctx.ellipse(sx - 8 * S * f, Y(18), 4.6 * S, 6 * S, 0, 0, 6.29); ctx.fill(); ctx.stroke();
    } else if (u.t === 'archer'){
      ctx.strokeStyle = P(C.woodD); ctx.lineWidth = Math.max(1.6, 2.2 * S);
      ctx.beginPath(); ctx.arc(sx + 6 * S * f, Y(21), 8 * S, -1.1, 1.1); ctx.stroke();
      ctx.strokeStyle = P('#f2e4c4'); ctx.lineWidth = Math.max(1, 1.2 * S);
      ctx.beginPath();
      ctx.moveTo(sx + (6 + 8 * Math.cos(-1.1)) * S * f, Y(21) + 8 * S * Math.sin(-1.1));
      ctx.lineTo(sx + (3 - sw * 3) * S * f, Y(21));
      ctx.lineTo(sx + (6 + 8 * Math.cos(1.1)) * S * f, Y(21) + 8 * S * Math.sin(1.1));
      ctx.stroke();
      ctx.strokeStyle = C.line; ctx.lineWidth = LW;
    } else {
      ctx.save(); ctx.translate(sx + 6 * S * f, Y(21)); ctx.rotate((-1.35 + sw * 0.9) * f);
      ctx.strokeStyle = P(C.woodD); ctx.lineWidth = Math.max(1.6, 2.4 * S);
      ctx.beginPath(); ctx.moveTo(0, 8 * S); ctx.lineTo(0, -22 * S); ctx.stroke();
      ctx.fillStyle = P('#cfdae6'); ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.2, 1.7 * S);
      ctx.beginPath(); ctx.moveTo(0, -30 * S); ctx.lineTo(4 * S, -20 * S); ctx.lineTo(-4 * S, -20 * S);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = P(team); ctx.strokeStyle = C.line; ctx.lineWidth = LW;
      ctx.beginPath(); roundRect(sx - 12 * S * f, Y(25), 8 * S, 16 * S, 3 * S); ctx.fill(); ctx.stroke();
    }
  }
  if (u.hp < u.maxHp) drawHpBar(sx, Y(u.t === 'ram' ? 34 : 41), 30 * z, u.hp / u.maxHp);
}

function drawFx(f){
  const z = cam.z, [sx, sy] = w2s(isoX(f.x, f.y), isoY(f.x, f.y));
  if (f.k === 'boom'){
    const p = f.t / 0.75;
    ctx.globalAlpha = 1 - p;
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.arc(sx, sy - 10*z, (14 + p * 34) * z * (f.s || 2) * 0.5, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#fff2c8';
    ctx.beginPath(); ctx.arc(sx, sy - 10*z, (7 + p * 16) * z * (f.s || 2) * 0.5, 0, 6.29); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (f.k === 'spark'){
    const p = f.t / 0.4;
    ctx.globalAlpha = 1 - p; ctx.strokeStyle = '#ffd25c'; ctx.lineWidth = 2.4 * z;
    for (let i = 0; i < 5; i++){
      const a = i * 1.25 + f.x;
      ctx.beginPath();
      ctx.moveTo(sx + Math.cos(a) * 4*z, sy - 8*z + Math.sin(a) * 3*z);
      ctx.lineTo(sx + Math.cos(a) * (5 + p*13)*z, sy - 8*z + Math.sin(a) * (3 + p*8)*z);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else {
    const p = f.t / 0.4;
    ctx.globalAlpha = 1 - p; ctx.strokeStyle = '#8fe07a'; ctx.lineWidth = 3 * z;
    ctx.beginPath(); ctx.ellipse(sx, sy, (10 + p*26)*z, (5 + p*13)*z, 0, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function renderBattle(dt){
  drawTerrain();
  const ents = [];
  TER.deco.forEach(d => { if (onScreen(d.gx, d.gy)) ents.push({ d: d.gx + d.gy, k:'deco', o:d }); });
  BT.structs.forEach(s => { if (!s.dead) ents.push({ d: s.gx + s.gy + TYPES[s.t].s * 0.5, k:'s', o:s }); });
  BT.units.forEach(u => { if (!u.dead) ents.push({ d: u.x + u.y, k:'u', o:u }); });
  ents.sort((a, b) => a.d - b.d);
  ents.forEach(e => {
    if (e.k === 'deco') drawDeco(e.o);
    else if (e.k === 'u') drawUnit(e.o);
    else {
      const s = e.o;
      if (s.flash){ ctx.save(); ctx.globalAlpha = 0.999; }
      drawBuilding(s, BT.kind === 'raid');
      if (s.flash){
        ctx.restore();
        const sz = TYPES[s.t].s;
        isoDiamond(s.gx, s.gy, sz, sz, 'rgba(255,255,255,.28)');
      }
      if (s.hp < s.maxHp){
        const sz = TYPES[s.t].s;
        const [cx, cy] = w2s(isoX(s.gx + sz/2, s.gy + sz/2), isoY(s.gx + sz/2, s.gy + sz/2));
        drawHpBar(cx, cy - (52 + sz * 20) * cam.z, 30 * cam.z, s.hp / s.maxHp);
      }
    }
  });
  // projectiles
  BT.projs.forEach(p => {
    const [sx, sy] = w2s(isoX(p.x, p.y), isoY(p.x, p.y));
    const z = cam.z;
    if (p.k === 'ball'){
      ctx.fillStyle = '#2b3440'; ctx.strokeStyle = C.line; ctx.lineWidth = 1.8*z;
      ctx.beginPath(); ctx.arc(sx, sy - 14*z, 4.5*z, 0, 6.29); ctx.fill(); ctx.stroke();
    } else {
      const a = Math.atan2(isoY(p.ty, p.ty) - isoY(p.y, p.y), 1);
      ctx.strokeStyle = '#f2e4c4'; ctx.lineWidth = 2.2*z; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sx - 6*z, sy - 14*z); ctx.lineTo(sx + 6*z, sy - 15*z); ctx.stroke();
    }
  });
  BT.fx.forEach(drawFx);
}

/* ============ battle HUD ============ */
function updateDmgBar(){
  const pct = clamp(BT.killedHp / BT.totalHp, 0, 1);
  $('dmgBar').style.width = (pct * 100).toFixed(1) + '%';
  const keepDead = !BT.structs.some(s => s.t === 'keep' && !s.dead);
  let st = 0; if (pct >= 0.5) st++; if (keepDead) st++; if (pct >= 0.999) st++;
  const row = $('starRow');
  if (row.dataset.v !== '' + st){
    row.dataset.v = '' + st;
    row.innerHTML = [0,1,2].map(i => ICON.star(i < st)).join('');
  }
  const m = Math.max(0, Math.floor(BT.time / 60)), s = Math.max(0, Math.floor(BT.time % 60));
  $('btTime').textContent = m + ':' + (s < 10 ? '0' : '') + s;
}
function updateBtHud(){ updateDmgBar(); }

function renderTray(){
  const tray = $('btTray');
  tray.innerHTML = ['raider','archer','lancer','ram'].filter(k => (ST.army[k] || 0) > 0 || (BT.avail[k] || 0) > 0)
    .map(k => '<button class="tcard' + (BT.sel === k ? ' sel' : '') + ((BT.avail[k]||0) <= 0 ? ' out' : '') +
      '" data-t="' + k + '"><canvas width="72" height="72"></canvas><span class="n">' + (BT.avail[k] || 0) + '</span></button>').join('');
  tray.querySelectorAll('.tcard').forEach(el => {
    drawTroopMini(el.querySelector('canvas'), el.dataset.t);
    el.onclick = () => { if ((BT.avail[el.dataset.t] || 0) > 0){ BT.sel = el.dataset.t; sfx.tap(); renderTray(); } };
  });
}

/* ============ modals ============ */
function modal(html, wire){
  const m = $('modal'); m.classList.remove('hide');
  m.innerHTML = '<div class="modal">' + html + '</div>';
  if (wire) wire(m);
}
function closeModal(){ $('modal').classList.add('hide'); $('modal').innerHTML = ''; }

function showResult(stars, loot, tro, won){
  modal(
    '<h2>' + (won ? 'HOLD TAKEN' : 'RAID FAILED') + '</h2>' +
    '<div id="resStars">' + [0,1,2].map(i => ICON.star(i < stars)).join('') + '</div>' +
    '<p class="lead">' + (won
      ? 'The valley learns your name. Stage ' + ST.stage + ' opens next.'
      : 'They held. Train a bigger warband and come back.') + '</p>' +
    '<div class="lootRow"><div>' + ICON.gold + fmt(loot.g) + '</div><div>' + ICON.iron + fmt(loot.i) + '</div>' +
    '<div>' + ICON.trophy + (tro >= 0 ? '+' : '') + tro + '</div></div>' +
    '<button class="btn gold big" id="resOk">RETURN TO HOLD</button>',
    m => { m.querySelector('#resOk').onclick = () => {
      closeModal(); syncHud(); checkQuests();
      if (Math.random() < 0.4 && ST.raids >= 2) setTimeout(offerDefend, 550); else centerOn(N/2, N/2, 1);
    }; });
}

function showDefendResult(held, lost, alive){
  modal(
    '<h2>' + (held ? 'LINE HELD' : 'HOLD SACKED') + '</h2>' +
    '<p class="lead">' + (held
      ? 'Every raider is down. Nothing left your vaults.'
      : alive + ' raider' + (alive > 1 ? 's' : '') + ' got through and emptied part of your stores.') + '</p>' +
    (held ? '' : '<div class="lootRow"><div>' + ICON.gold + '−' + fmt(lost.g) + '</div><div>' + ICON.iron + '−' + fmt(lost.i) + '</div></div>') +
    '<button class="btn gold big" id="dOk">BACK TO HOLD</button>',
    m => { m.querySelector('#dOk').onclick = () => { closeModal(); syncHud(); centerOn(N/2, N/2, 1); }; });
}

function offerDefend(){
  modal(
    '<h2>RAIDERS SIGHTED</h2>' +
    '<p class="lead">A warband is marching on your hold. Your cannons and towers fire on their own — send troops in to help, or let the walls do the work.</p>' +
    '<button class="btn red big" id="dGo">DEFEND THE HOLD</button>',
    m => { m.querySelector('#dGo').onclick = () => { closeModal(); startDefend(); }; });
}

function showScout(){
  const stage = ST.stage, loot = enemyLoot(stage);
  modal(
    '<h2>FIND A TARGET</h2>' +
    '<p class="lead">Stage ' + stage + ' hold. Take half of it for one star, level it for three.</p>' +
    '<div class="lootRow"><div>' + ICON.gold + fmt(loot.g) + '</div><div>' + ICON.iron + fmt(loot.i) + '</div></div>' +
    '<p class="lead">Warband ready: ' + Object.keys(TROOP).map(k => (ST.army[k] || 0) + ' ' + TROOP[k].n).join(' · ') + '</p>' +
    '<button class="btn red big" id="scGo">MARCH OUT</button>' +
    '<button class="btn grey big" id="scNo">NOT YET</button>',
    m => {
      m.querySelector('#scGo').onclick = () => { closeModal(); startRaid(); };
      m.querySelector('#scNo').onclick = () => { closeModal(); };
    });
}


/* ============ wiring ============ */
$('bBuild').onclick = () => { sfx.tap(); if (mode === 'place') cancelPlace(); renderBuild(); };
$('bArmy').onclick  = () => { sfx.tap(); if (mode === 'place') cancelPlace(); renderArmy(); };
$('bQuest').onclick = () => { sfx.tap(); if (mode === 'place') cancelPlace(); renderQuests(); };
$('bRaid').onclick  = () => { sfx.tap(); if (mode === 'place') cancelPlace(); showScout(); };
$('btEnd').onclick  = () => { sfx.tap(); endBattle(); };
$('homeBtn').onclick = () => { sfx.tap(); const k = keepB(); centerOn(k.gx + 1.5, k.gy + 1.5, Math.max(cam.z, 0.9)); };

onTap = (x, y) => { if (mode === 'battle') deployAt(x, y); else baseTap(x, y); };
onPress = (x, y) => { if (mode !== 'battle') basePress(x, y); };
onDragMove = (x, y) => baseDrag(x, y);
onDragEnd = () => {};

/* ============ onboarding ============ */
function intro(){
  modal(
    '<h2>IRONVOW</h2>' +
    '<p class="lead">Your hold sits in a valley full of people who want it.<br><br>' +
    'Mines make gold while you are away. Barracks turn gold into troops. ' +
    'Troops take other holds apart, and what you carry home pays for the next Keep. ' +
    'Cannons and towers keep your own gold where it belongs.</p>' +
    '<button class="btn gold big" id="goPlay">TAKE THE HOLD</button>',
    m => { m.querySelector('#goPlay').onclick = () => {
      closeModal(); actx(); ST.tutorial = true; save();
      toast('Tap the pouch over your mine to collect gold');
    }; });
}

/* ============ main loop ============ */
let last = performance.now(), acc = 0, saveAcc = 0;
function frame(now){
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.05);
  T += dt;

  if (mode === 'battle' && BT.on){
    updateBattle(dt);
    renderBattle(dt);
  } else {
    tickProduction(dt, false);
    tickQueue(dt);
    renderBase(dt);
    acc += dt;
    if (acc > 0.25){ acc = 0; syncHud(); if (!sheet.classList.contains('hide') && sheet.querySelector('h2') && sheet.querySelector('h2').textContent === 'ARMY') renderArmy(); }
    saveAcc += dt;
    if (saveAcc > 10){ saveAcc = 0; save(); }
  }
  requestAnimationFrame(frame);
}

/* ============ boot ============ */
function boot(){
  genTerrain();
  if (!load()) ST = freshState();
  resize();
  const k = keepB();
  centerOn(k.gx + 1.5, k.gy + 1.5, 0.95);
  syncHud();
  if (!ST.tutorial) intro();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('pagehide', save);
boot();

</script>
