<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2432">
<title>IRONVOW — Forge. Muster. Conquer.</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#1b2432;touch-action:none;overscroll-behavior:none;
    font-family:'Arial Black','Segoe UI Black',Impact,Arial,sans-serif;color:#f2e4c4}
  #c{display:block;width:100vw;height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .hide{display:none!important}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  #hud > *{pointer-events:auto}

  .res{position:absolute;top:calc(9px + env(safe-area-inset-top));display:flex;align-items:center;gap:7px;
    background:linear-gradient(#243248,#18212f);border:2px solid #3d5170;border-radius:13px;padding:5px 13px 5px 7px;
    box-shadow:0 4px 0 #0d1420,0 7px 14px rgba(0,0,0,.35);min-width:104px}
  .res .ic{width:24px;height:24px;flex:none}
  .res .col{display:flex;flex-direction:column;line-height:1}
  .res .v{font-size:14px;letter-spacing:.4px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  .res .cap{font-size:8px;letter-spacing:1.6px;color:#8fa6c4;font-family:Arial;font-weight:900;margin-top:3px}
  #rGold{left:9px}
  #rIron{left:121px}

  #keepBadge{position:absolute;top:calc(9px + env(safe-area-inset-top));right:9px;
    background:linear-gradient(#e8b23c,#c2891f);border-radius:13px;padding:6px 12px;text-align:center;
    box-shadow:0 4px 0 #8a5c10,0 7px 14px rgba(0,0,0,.35);color:#33240a}
  #keepBadge .n{font-size:17px;line-height:1}
  #keepBadge .t{font-size:7.5px;letter-spacing:1.6px;font-family:Arial;font-weight:900;margin-top:3px}

  #trophyBar{position:absolute;top:calc(68px + env(safe-area-inset-top));right:9px;display:flex;align-items:center;gap:5px;
    background:rgba(20,28,40,.82);border:2px solid #3d5170;border-radius:11px;padding:4px 10px 4px 6px;font-size:12px}

  /* ---------- bottom rail ---------- */
  #rail{position:absolute;left:0;right:0;bottom:calc(9px + env(safe-area-inset-bottom));
    display:flex;justify-content:center;gap:9px;padding:0 9px}
  .rbtn{width:66px;height:60px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    background:linear-gradient(#2c3d57,#1b2635);border:2px solid #46608a;box-shadow:0 4px 0 #0d1420;transition:transform .08s}
  .rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d1420}
  .rbtn svg{width:26px;height:26px}
  .rbtn span{font-size:8.5px;letter-spacing:1.2px;font-family:Arial;font-weight:900;color:#c3d4ea}
  .rbtn.gold{background:linear-gradient(#f0bb45,#c2891f);border-color:#ffd97a;box-shadow:0 4px 0 #7d5310}
  .rbtn.gold span{color:#3a2708}
  .rbtn.red{background:linear-gradient(#d64f38,#a32e1c);border-color:#ff8a70;box-shadow:0 4px 0 #6d1c0f}
  .rbtn.red span{color:#ffe2d8}
  .rbtn .dot{position:absolute;margin:-40px 0 0 40px;width:11px;height:11px;border-radius:50%;background:#ff4a3d;border:2px solid #fff}

  /* ---------- sheets ---------- */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:70vh;overflow-y:auto;
    background:linear-gradient(#22304a,#141d2b);border-top:3px solid #e8b23c;border-radius:20px 20px 0 0;
    padding:14px 13px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.5);
    animation:slideUp .22s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @media (prefers-reduced-motion:reduce){.sheet{animation:none}}
  .sheetHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .sheetHead h2{font-size:15px;letter-spacing:2px;color:#f2e4c4}
  .sheetHead p{font-size:10px;font-family:Arial;font-weight:700;color:#8fa6c4;letter-spacing:.3px;margin-top:4px}
  .xbtn{width:32px;height:32px;border-radius:10px;background:#31435f;font-size:16px;line-height:1;color:#c3d4ea;flex:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
  .card{background:linear-gradient(#31435f,#22304a);border:2px solid #46608a;border-radius:14px;padding:9px 7px;
    display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;transition:transform .08s}
  .card:active{transform:scale(.96)}
  .card.locked{opacity:.42;filter:grayscale(.6)}
  .card.poor{border-color:#7a3c33}
  .card canvas{width:52px;height:52px}
  .card .nm{font-size:9.5px;letter-spacing:.8px;text-align:center;line-height:1.25}
  .card .cost{display:flex;align-items:center;gap:4px;font-size:10.5px;color:#ffd97a}
  .card .cost.no{color:#ff7a63}
  .card .cost svg{width:13px;height:13px}
  .card .sub{font-size:8px;font-family:Arial;font-weight:900;letter-spacing:.9px;color:#8fa6c4}
  .card .cnt{position:absolute;top:5px;right:6px;font-size:8.5px;font-family:Arial;font-weight:900;color:#8fa6c4}

  /* ---------- inspector ---------- */
  #insp{position:fixed;left:9px;right:9px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:15;
    background:linear-gradient(#22304a,#141d2b);border:2px solid #46608a;border-radius:16px;padding:11px 12px;
    box-shadow:0 8px 22px rgba(0,0,0,.45);display:flex;align-items:center;gap:11px}
  #insp canvas{width:46px;height:46px;flex:none}
  #insp .info{flex:1;min-width:0}
  #insp .info h3{font-size:12.5px;letter-spacing:1.2px}
  #insp .info p{font-size:9.5px;font-family:Arial;font-weight:700;color:#8fa6c4;margin-top:3px;line-height:1.4}
  #insp .acts{display:flex;flex-direction:column;gap:5px;flex:none}
  .btn{border-radius:11px;padding:8px 13px;font-size:10px;letter-spacing:1.1px;
    background:linear-gradient(#4fa85a,#2f7a3c);box-shadow:0 3px 0 #1d4d26;color:#eaffe9;transition:transform .08s}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #1d4d26}
  .btn.grey{background:linear-gradient(#4a5f80,#31435f);box-shadow:0 3px 0 #1b2635;color:#c3d4ea}
  .btn.gold{background:linear-gradient(#f0bb45,#c2891f);box-shadow:0 3px 0 #7d5310;color:#3a2708}
  .btn.red{background:linear-gradient(#d64f38,#a32e1c);box-shadow:0 3px 0 #6d1c0f;color:#ffe2d8}
  .btn:disabled{opacity:.45;box-shadow:none;transform:none}

  /* ---------- placement bar ---------- */
  #placeBar{position:fixed;left:9px;right:9px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:16;
    display:flex;align-items:center;gap:9px;background:linear-gradient(#22304a,#141d2b);
    border:2px solid #e8b23c;border-radius:16px;padding:10px 12px;box-shadow:0 8px 22px rgba(0,0,0,.45)}
  #placeBar .t{flex:1;font-size:10.5px;letter-spacing:.8px;line-height:1.35}
  #placeBar .t em{font-style:normal;color:#8fa6c4;font-family:Arial;font-weight:700;font-size:9px;display:block;margin-top:3px}

  /* ---------- battle ---------- */
  #btHud{position:fixed;inset:0;pointer-events:none;z-index:8}
  #btHud > *{pointer-events:auto}
  #btTop{position:absolute;top:calc(9px + env(safe-area-inset-top));left:9px;right:9px;
    display:flex;align-items:center;gap:9px}
  #btTop .box{background:rgba(20,28,40,.86);border:2px solid #3d5170;border-radius:12px;padding:6px 11px;text-align:center}
  #btTop .box .v{font-size:13px}
  #btTop .box .cap{font-size:7.5px;letter-spacing:1.5px;color:#8fa6c4;font-family:Arial;font-weight:900;margin-top:3px}
  #dmgWrap{flex:1;background:rgba(20,28,40,.86);border:2px solid #3d5170;border-radius:12px;padding:6px 10px}
  #dmgBarBg{height:9px;background:#0d1420;border-radius:5px;overflow:hidden;margin-top:5px}
  #dmgBar{height:100%;width:0;background:linear-gradient(90deg,#e8b23c,#ff7a3d);transition:width .2s}
  #starRow{display:flex;gap:3px;justify-content:center}
  #starRow svg{width:15px;height:15px}
  #btTray{position:absolute;left:0;right:0;bottom:calc(9px + env(safe-area-inset-bottom));
    display:flex;gap:8px;justify-content:center;padding:0 9px;flex-wrap:wrap}
  .tcard{width:62px;background:linear-gradient(#2c3d57,#1b2635);border:2px solid #46608a;border-radius:13px;
    padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
  .tcard.sel{border-color:#e8b23c;background:linear-gradient(#5a4620,#3a2c11);transform:translateY(-4px)}
  .tcard.out{opacity:.35}
  .tcard canvas{width:34px;height:34px}
  .tcard .n{font-size:11px;color:#ffd97a}

  /* ---------- modal ---------- */
  .ovl{position:fixed;inset:0;z-index:40;background:rgba(8,12,20,.78);
    display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(3px)}
  .modal{width:100%;max-width:340px;background:linear-gradient(#25344e,#141d2b);
    border:3px solid #e8b23c;border-radius:22px;padding:20px 18px;text-align:center;
    box-shadow:0 16px 44px rgba(0,0,0,.6);max-height:86vh;overflow-y:auto}
  .modal h2{font-size:19px;letter-spacing:2.4px;margin-bottom:7px}
  .modal .lead{font-size:10.5px;font-family:Arial;font-weight:700;color:#8fa6c4;line-height:1.55;margin-bottom:15px}
  .modal .big{display:block;width:100%;padding:13px;font-size:13px;letter-spacing:1.8px;border-radius:14px;margin-top:9px}
  .lootRow{display:flex;justify-content:center;gap:16px;margin:13px 0}
  .lootRow div{display:flex;align-items:center;gap:5px;font-size:14px;color:#ffd97a}
  .lootRow svg{width:19px;height:19px}
  #resStars{display:flex;justify-content:center;gap:7px;margin:5px 0 11px}
  #resStars svg{width:38px;height:38px}

  /* quests */
  .qrow{display:flex;align-items:center;gap:10px;background:#22304a;border:2px solid #3d5170;
    border-radius:13px;padding:9px 10px;margin-bottom:7px;text-align:left}
  .qrow.done{border-color:#3f7a45;opacity:.6}
  .qrow .qi{flex:1;min-width:0}
  .qrow .qi h4{font-size:10.5px;letter-spacing:.7px}
  .qrow .qi p{font-size:9px;font-family:Arial;font-weight:700;color:#8fa6c4;margin-top:3px}
  .qbarBg{height:6px;background:#0d1420;border-radius:4px;margin-top:6px;overflow:hidden}
  .qbar{height:100%;background:linear-gradient(90deg,#4fa85a,#8fe07a)}
  .qrw{font-size:10px;color:#ffd97a;display:flex;align-items:center;gap:4px;flex:none}
  .qrw svg{width:14px;height:14px}

  #homeBtn{position:absolute;left:9px;bottom:calc(80px + env(safe-area-inset-bottom));
    width:46px;height:46px;border-radius:14px;background:linear-gradient(#2c3d57,#1b2635);
    border:2px solid #46608a;box-shadow:0 4px 0 #0d1420;display:flex;align-items:center;justify-content:center}
  #homeBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d1420}
  #homeBtn svg{width:22px;height:22px}

  /* toast */
  #toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;
    background:rgba(20,28,40,.94);border:2px solid #e8b23c;border-radius:12px;padding:9px 16px;
    font-size:11px;letter-spacing:.7px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:90vw}
  #toast.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="res" id="rGold"><span class="ic" id="icG"></span><span class="col"><span class="v" id="vGold">0</span><span class="cap">GOLD</span></span></div>
  <div class="res" id="rIron"><span class="ic" id="icI"></span><span class="col"><span class="v" id="vIron">0</span><span class="cap">IRON</span></span></div>
  <div id="keepBadge"><div class="n" id="vKeep">1</div><div class="t">KEEP</div></div>
  <div id="trophyBar"><span id="icT"></span><span id="vTrophy">0</span></div>

  <button id="homeBtn" aria-label="Centre on the keep"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd97a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg></button>

  <div id="rail">
    <button class="rbtn" id="bBuild"><svg viewBox="0 0 24 24" fill="none" stroke="#8fe07a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M10 21v-6h4v6"/></svg><span>BUILD</span></button>
    <button class="rbtn" id="bArmy"><svg viewBox="0 0 24 24" fill="none" stroke="#9fc4ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5 20 9l-9.5 9.5M4 20l4-4M3.5 9.5 9 4l9.5 9.5L13 19z"/></svg><span>ARMY</span></button>
    <button class="rbtn" id="bQuest"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd97a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5M9 8h4"/></svg><span>ORDERS</span><span class="dot hide" id="qDot"></span></button>
    <button class="rbtn red" id="bRaid"><svg viewBox="0 0 24 24" fill="none" stroke="#ffe2d8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l7 7M8 4H4v4M20 4l-7 7M16 4h4v4M9 15l-5 5M4 16v4h4M15 15l5 5M20 16v4h-4"/></svg><span>RAID</span></button>
  </div>
</div>

<div id="btHud" class="hide">
  <div id="btTop">
    <div class="box"><div class="v" id="btTime">3:00</div><div class="cap">TIME</div></div>
    <div id="dmgWrap"><div id="starRow"></div><div id="dmgBarBg"><div id="dmgBar"></div></div></div>
    <button class="box btn red" id="btEnd" style="padding:8px 12px">END</button>
  </div>
  <div id="btTray"></div>
</div>

<div id="insp" class="hide"></div>
<div id="placeBar" class="hide"></div>
<div id="sheet" class="sheet hide"></div>
<div id="modal" class="ovl hide"></div>
<div id="toast"></div>

<script>
"use strict";
/* ============ IRONVOW — core ============ */
const TW = 64, TH = 32;          // iso tile width / height (world units at zoom 1)
const N  = 56;                    // full terrain grid
const IN0 = 2, IN1 = N - 2;       // buildable inner bounds — 52 x 52 = 2704 usable cells

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  clampCam();
}
window.addEventListener('resize', resize);

/* ---- iso projection ---- */
function isoX(gx, gy){ return (gx - gy) * TW / 2; }
function isoY(gx, gy){ return (gx + gy) * TH / 2; }

const cam = { x: 0, y: 0, z: 1, tz: 1 };

function w2s(wx, wy){ return [ (wx - cam.x) * cam.z + W/2, (wy - cam.y) * cam.z + H/2 ]; }
function s2w(sx, sy){ return [ (sx - W/2) / cam.z + cam.x, (sy - H/2) / cam.z + cam.y ]; }
function s2g(sx, sy){
  const [wx, wy] = s2w(sx, sy);
  return [ (wx / (TW/2) + wy / (TH/2)) / 2, (wy / (TH/2) - wx / (TW/2)) / 2 ];
}

function clampCam(){
  cam.z = Math.max(0.7, Math.min(1.9, cam.z));
  // the point under the middle of the screen always stays over the buildable field,
  // so the treeline apron is the furthest you can ever pan
  const gx = (cam.x / (TW/2) + cam.y / (TH/2)) / 2;
  const gy = (cam.y / (TH/2) - cam.x / (TW/2)) / 2;
  const lo = IN0 + 1, hi = IN1 - 1;
  const cgx = clamp(gx, lo, hi), cgy = clamp(gy, lo, hi);
  cam.x = isoX(cgx, cgy); cam.y = isoY(cgx, cgy);
}

// exact screen-space test — far cheaper and tighter than a grid bounding box
function onScreen(gx, gy, pad){
  const [sx, sy] = w2s(isoX(gx, gy), isoY(gx, gy));
  const p = pad || 70;
  return sx > -p && sx < W + p && sy > -p && sy < H + p * 2.2;
}

function centerOn(gx, gy, z){
  if (z) cam.z = cam.tz = z;
  cam.x = isoX(gx, gy); cam.y = isoY(gx, gy); clampCam();
}

/* ---- rng ---- */
function mulberry(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
  return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

/* ---- misc helpers ---- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const dist  = (ax,ay,bx,by) => Math.hypot(ax-bx, ay-by);
function fmt(n){ n = Math.floor(n);
  if (n >= 1e6) return (n/1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M';
  if (n >= 1e4) return (n/1e3).toFixed(0) + 'K';
  if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
  return '' + n; }
const $ = id => document.getElementById(id);

let toastT = 0;
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1700);
}

/* ---- audio (tiny synth, no assets) ---- */
let AC = null;
function actx(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } return AC; }
function beep(freq, dur, type, vol){
  const a = actx(); if (!a) return;
  if (a.state === 'suspended') a.resume();
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, a.currentTime);
  g.gain.linearRampToValueAtTime(vol || 0.06, a.currentTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + (dur || 0.12));
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + (dur || 0.12) + 0.02);
}
const sfx = {
  tap:   () => beep(520, 0.07, 'square', 0.04),
  place: () => { beep(300, 0.1, 'square', 0.06); setTimeout(() => beep(440, 0.13, 'square', 0.05), 70); },
  coin:  () => { beep(880, 0.06, 'triangle', 0.05); setTimeout(() => beep(1180, 0.09, 'triangle', 0.04), 55); },
  up:    () => { [520, 660, 830].forEach((f,i) => setTimeout(() => beep(f, 0.12, 'triangle', 0.05), i*80)); },
  hit:   () => beep(150 + Math.random()*60, 0.05, 'sawtooth', 0.035),
  boom:  () => beep(80, 0.28, 'sawtooth', 0.08),
  bad:   () => beep(160, 0.22, 'sawtooth', 0.05),
  win:   () => { [523, 659, 784, 1046].forEach((f,i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.06), i*110)); }
};

/* ---- shared colour set ---- */
const C = {
  grass:'#6ea844', grass2:'#7cb84e', grass3:'#63993d',
  dirt:'#b4854a', dirt2:'#9c6f3b',
  forest:'#2c5c33', forestD:'#1d4023',
  iron:'#1b2432', gold:'#e8b23c', goldD:'#a8761b',
  parch:'#f2e4c4', blood:'#c2412d',
  stone:'#8d9aa8', stoneD:'#5f6d7d', stoneL:'#b6c2cd',
  wood:'#8a5a30', woodD:'#5d3b1e',
  line:'#141c28'
};

/* ---- iso drawing primitives ---- */
// Draws a chunky outlined iso cuboid. gx,gy = top-left grid cell, w,h in cells, hgt in px (screen, pre-zoom).
function isoBox(gx, gy, w, h, hgt, top, left, right, out){
  const z = cam.z, o = out || C.line;
  const P = (ax, ay, dz) => { const [sx, sy] = w2s(isoX(ax, ay), isoY(ax, ay)); return [sx, sy - dz * z]; };
  const a = P(gx,     gy,     0),  b = P(gx + w, gy,     0);
  const c = P(gx + w, gy + h, 0),  d = P(gx,     gy + h, 0);
  const A = P(gx,     gy,     hgt), B = P(gx + w, gy,    hgt);
  const Cc= P(gx + w, gy + h, hgt), D = P(gx,     gy + h, hgt);
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(1.6, 2.6 * z); ctx.strokeStyle = o;
  // left face (a-d-D-A)
  ctx.fillStyle = left;
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(d[0],d[1]); ctx.lineTo(D[0],D[1]); ctx.lineTo(A[0],A[1]); ctx.closePath(); ctx.fill(); ctx.stroke();
  // right face (d-c-Cc-D)
  ctx.fillStyle = right;
  ctx.beginPath(); ctx.moveTo(d[0],d[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(Cc[0],Cc[1]); ctx.lineTo(D[0],D[1]); ctx.closePath(); ctx.fill(); ctx.stroke();
  // top face
  ctx.fillStyle = top;
  ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(Cc[0],Cc[1]); ctx.lineTo(D[0],D[1]); ctx.closePath(); ctx.fill(); ctx.stroke();
  return { A, B, C: Cc, D, cx: (A[0]+Cc[0])/2, cy: (A[1]+Cc[1])/2 };
}

function isoDiamond(gx, gy, w, h, fill, dz, stroke){
  const z = cam.z;
  const P = (ax, ay) => { const [sx, sy] = w2s(isoX(ax, ay), isoY(ax, ay)); return [sx, sy - (dz||0) * z]; };
  const a = P(gx, gy), b = P(gx+w, gy), c = P(gx+w, gy+h), d = P(gx, gy+h);
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(d[0],d[1]); ctx.closePath(); ctx.fill();
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = Math.max(1.4, 2.2 * cam.z); ctx.stroke(); }
}

function shadowAt(gx, gy, w, h){
  const z = cam.z;
  const [sx, sy] = w2s(isoX(gx + w/2, gy + h/2), isoY(gx + w/2, gy + h/2));
  ctx.fillStyle = 'rgba(20,40,18,.26)';
  ctx.beginPath(); ctx.ellipse(sx, sy + 3*z, (w * TW/2) * 0.62 * z, (h * TH/2) * 0.72 * z, 0, 0, 6.29); ctx.fill();
}

function roundRect(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

/* ---- input: pan / pinch / tap ---- */
const ptr = { down:false, moved:false, sx:0, sy:0, lx:0, ly:0, t:0, pinch:0, pz:1 };
let onTap = null;              // set per-mode
let onPress = null;            // pointer went down
let onDragMove = null;         // called instead of camera pan while dragActive
let onDragEnd = null;
let dragActive = false;        // true => the pointer is moving a building, not the camera

function evXY(e){ const t = e.touches ? e.touches[0] : e; return [t.clientX, t.clientY]; }

cvs.addEventListener('pointerdown', e => {
  actx(); cvs.setPointerCapture(e.pointerId);
  ptr.down = true; ptr.moved = false; ptr.t = performance.now();
  ptr.sx = ptr.lx = e.clientX; ptr.sy = ptr.ly = e.clientY;
  dragActive = false;
  if (onPress) onPress(e.clientX, e.clientY);
});
cvs.addEventListener('pointermove', e => {
  if (!ptr.down) { hoverMove(e.clientX, e.clientY); return; }
  const dx = e.clientX - ptr.lx, dy = e.clientY - ptr.ly;
  if (Math.abs(e.clientX - ptr.sx) + Math.abs(e.clientY - ptr.sy) > 9) ptr.moved = true;
  if (ptr.moved){
    if (dragActive && onDragMove) onDragMove(e.clientX, e.clientY);
    else { cam.x -= dx / cam.z; cam.y -= dy / cam.z; clampCam(); }
  }
  ptr.lx = e.clientX; ptr.ly = e.clientY;
  hoverMove(e.clientX, e.clientY);
});
cvs.addEventListener('pointerup', e => {
  if (ptr.down && !ptr.moved && onTap) onTap(e.clientX, e.clientY);
  if (dragActive && onDragEnd) onDragEnd();
  ptr.down = false; dragActive = false;
  if (onDragEnd) clearLongPress();
});
cvs.addEventListener('pointercancel', () => { ptr.down = false; dragActive = false; clearLongPress(); });

let lpTimer = 0;
function clearLongPress(){ clearTimeout(lpTimer); lpTimer = 0; }
cvs.addEventListener('wheel', e => { e.preventDefault(); cam.z *= e.deltaY > 0 ? 0.92 : 1.08; clampCam(); }, { passive:false });

let hoverMove = () => {};

// two-finger pinch
cvs.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    ptr.pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    ptr.pz = cam.z; ptr.moved = true;
  }
}, { passive:true });
cvs.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && ptr.pinch){
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    cam.z = ptr.pz * (d / ptr.pinch); clampCam();
  }
}, { passive:true });
cvs.addEventListener('touchend', e => { if (e.touches.length < 2) ptr.pinch = 0; }, { passive:true });


/* ============ terrain ============ */
let T = 0;                     // global animation clock (seconds)
const APRON = 26;   // deep-forest surround, sized so the flat backdrop can never enter frame
const TREEBAND = 12;
const TER = { tile: [], deco: [] };

function genTerrain(){
  const r = mulberry(20260905);
  TER.tile = []; TER.deco = [];
  for (let gy = 0; gy < N; gy++){
    for (let gx = 0; gx < N; gx++){
      const outside = gx < IN0 || gy < IN0 || gx >= IN1 || gy >= IN1;
      TER.tile[gy*N+gx] = outside ? 1 : 0;
    }
  }
}

function visibleGrid(){
  const c0 = s2g(-120, -120), c1 = s2g(W+120, -120), c2 = s2g(W+120, H+120), c3 = s2g(-120, H+120);
  return [ Math.min(c0[0],c1[0],c2[0],c3[0]), Math.max(c0[0],c1[0],c2[0],c3[0]),
           Math.min(c0[1],c1[1],c2[1],c3[1]), Math.max(c0[1],c1[1],c2[1],c3[1]) ];
}

function drawTerrain(){
  ctx.fillStyle = '#0e1a12'; ctx.fillRect(0, 0, W, H);   // sentinel: this should never be visible in play
  // deep-forest apron, then the play field on top of it
  // the surround is the same grass as the field — nothing reads as dead space
  isoDiamond(-APRON, -APRON, N + APRON*2, N + APRON*2, '#69a141');
  isoDiamond(-APRON*0.45, -APRON*0.45, N + APRON*0.9, N + APRON*0.9, C.grass);
  const v = visibleGrid();
  const gx0 = clamp(Math.floor(v[0]), 0, N-1), gx1 = clamp(Math.ceil(v[1]), 0, N);
  const gy0 = clamp(Math.floor(v[2]), 0, N-1), gy1 = clamp(Math.ceil(v[3]), 0, N);
  for (let gy = gy0; gy < gy1; gy++){
    for (let gx = gx0; gx < gx1; gx++){
      const t = TER.tile[gy*N+gx];
      if (t === 0) continue;
      isoDiamond(gx, gy, 1.04, 1.04, C.grass);
    }
  }
  ctx.save(); ctx.globalAlpha = 0.34;
  isoDiamond(IN0, IN0, IN1 - IN0, IN1 - IN0, 'rgba(0,0,0,0)', 0, '#4d7f33');
  ctx.restore();
}

function drawDeco(d){
  const z = cam.z, [sx, sy] = w2s(isoX(d.gx, d.gy), isoY(d.gx, d.gy));
  if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 80) return;
  const s = d.s * z;
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(1.3, 2.2 * z); ctx.strokeStyle = C.line;
  if (d.k === 'tree'){
    const sway = Math.sin(T * 1.1 + d.p) * 1.8 * s;
    ctx.fillStyle = 'rgba(20,40,18,.24)';
    ctx.beginPath(); ctx.ellipse(sx, sy + 2*z, 11*s, 5*s, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = C.woodD;
    ctx.beginPath(); roundRect(sx - 2.6*s, sy - 16*s, 5.2*s, 17*s, 2*s); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3f8a41';
    ctx.beginPath(); ctx.ellipse(sx + sway, sy - 26*s, 14*s, 12*s, 0, 0, 6.29); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#54a84f';
    ctx.beginPath(); ctx.ellipse(sx + sway - 3*s, sy - 30*s, 8*s, 6.5*s, 0, 0, 6.29); ctx.fill();
  } else if (d.k === 'rock'){
    ctx.fillStyle = 'rgba(20,40,18,.22)';
    ctx.beginPath(); ctx.ellipse(sx, sy + 2*z, 10*s, 4.5*s, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = C.stone;
    ctx.beginPath(); ctx.moveTo(sx-9*s, sy); ctx.lineTo(sx-5*s, sy-9*s); ctx.lineTo(sx+3*s, sy-11*s);
    ctx.lineTo(sx+9*s, sy-3*s); ctx.lineTo(sx+6*s, sy+1*s); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.stoneL;
    ctx.beginPath(); ctx.moveTo(sx-5*s, sy-9*s); ctx.lineTo(sx+3*s, sy-11*s); ctx.lineTo(sx+1*s, sy-6*s); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = '#3f8a41';
    ctx.beginPath(); ctx.ellipse(sx, sy - 5*s, 9*s, 7*s, 0, 0, 6.29); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#54a84f';
    ctx.beginPath(); ctx.ellipse(sx - 2*s, sy - 8*s, 5*s, 4*s, 0, 0, 6.29); ctx.fill();
  }
}

// hip roof: four slopes meeting at a ridge point above the centre
function isoRoof(gx, gy, w, h, baseH, peakH, light, dark){
  const z = cam.z;
  const P = (ax, ay, dz) => { const [sx, sy] = w2s(isoX(ax, ay), isoY(ax, ay)); return [sx, sy - dz * z]; };
  const A = P(gx, gy, baseH), B = P(gx + w, gy, baseH),
        Cc = P(gx + w, gy + h, baseH), D = P(gx, gy + h, baseH),
        K = P(gx + w/2, gy + h/2, peakH);
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(1.5, 2.5 * z); ctx.strokeStyle = C.line;
  const face = (p, q, col) => { ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.lineTo(K[0], K[1]); ctx.closePath();
    ctx.fill(); ctx.stroke(); };
  face(A, B, dark); face(A, D, dark);      // back slopes
  face(D, Cc, light); face(B, Cc, dark);   // front slopes
  return K;
}

    const r = isoBox(gx+0.22, gy+0.22, 1.55, 1.55, 42, '#a8927c', '#6b5a49', '#8a765f');
    isoRoof(gx+0.22, gy+0.22, 1.55, 1.55, 42, 60, '#7d5a3c', '#54402c');
    const [px, py] = w2s(isoX(gx+0.575, gy+0.575), isoY(gx+0.575, gy+0.575));
    const cy = py - 74*z;
    for (let i = 0; i < 4; i++){
      const t = (T*0.55 + i*0.25) % 1;
      ctx.fillStyle = 'rgba(190,200,212,' + (0.4 * (1-t)).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(px + Math.sin(t*5 + i)*8*z, cy - t*42*z, (3.5 + t*9) * z, 0, 6.29); ctx.fill();
    }
    // forge glow
    const gl = 0.55 + Math.sin(T*4.5)*0.2;
    ctx.fillStyle = 'rgba(255,140,40,' + gl.toFixed(2) + ')';
    const [ax, ay] = w2s(isoX(gx+1.5, gy+1.5), isoY(gx+1.5, gy+1.5));
    ctx.beginPath(); ctx.ellipse(ax, ay - 10*z, 8*z, 5.5*z, 0, 0, 6.29); ctx.fill();

  } else if (b.t === 'store'){
    isoBox(gx+0.08, gy+0.08, s-0.16, s-0.16, 8, '#6b5340', '#4a382b', '#5a4636');
    const r = isoBox(gx+0.25, gy+0.25, 1.5, 1.5, 44, C.wood, C.woodD, '#734829');
    isoRoof(gx+0.25, gy+0.25, 1.5, 1.5, 44, 60, '#a06f3d', '#6b4526');
    ctx.strokeStyle = C.gold; ctx.lineWidth = Math.max(1.8, 3*z);
    ctx.beginPath(); ctx.moveTo(r.A[0], r.A[1]); ctx.lineTo(r.C[0], r.C[1]); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r.B[0], r.B[1]); ctx.lineTo(r.D[0], r.D[1]); ctx.stroke();
    ctx.fillStyle = C.gold; ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.2, 2*z);
    ctx.beginPath(); ctx.ellipse(r.cx, r.cy, 6*z, 6*z, 0, 0, 6.29); ctx.fill(); ctx.stroke();

  } else if (b.t === 'barr'){
    isoBox(gx+0.08, gy+0.08, s-0.16, s-0.16, 9, C.dirt, C.dirt2, '#a87a41');
    isoBox(gx+0.42, gy+0.42, s-0.84, s-0.84, 40, '#a8926f', '#5a3a21', '#8c5f39');
    const K = isoRoof(gx+0.3, gy+0.3, s-0.6, s-0.6, 40, 104, '#e2d3ad', '#8f7a52');
    const [px, py] = w2s(isoX(gx+s/2, gy+s/2), isoY(gx+s/2, gy+s/2));
    // door
    ctx.fillStyle = '#3f2d1c'; ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.2, 2*z);
    const [dx2, dy2] = w2s(isoX(gx+s/2, gy+s-0.42), isoY(gx+s/2, gy+s-0.42));
    ctx.beginPath(); roundRect(dx2 - 7*z, dy2 - 26*z, 14*z, 22*z, 6*z); ctx.fill(); ctx.stroke();
    // spear rack leaning on the wall
    ctx.strokeStyle = C.woodD; ctx.lineWidth = Math.max(1.8, 2.9*z); ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++){
      const bx = dx2 - 34*z + i*9*z;
      ctx.beginPath(); ctx.moveTo(bx, dy2 - 2*z); ctx.lineTo(bx + 4*z, dy2 - 28*z); ctx.stroke();
      ctx.fillStyle = '#c9d6e4'; ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, 1.6*z);
      ctx.beginPath(); ctx.moveTo(bx + 4*z, dy2 - 34*z); ctx.lineTo(bx + 7*z, dy2 - 27*z);
      ctx.lineTo(bx + 1*z, dy2 - 27*z); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = C.woodD; ctx.lineWidth = Math.max(1.8, 2.9*z);
    }
    // pennant on the ridge
    ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.3, 2.1*z);
    ctx.beginPath(); ctx.moveTo(K[0], K[1]); ctx.lineTo(K[0], K[1] - 20*z); ctx.stroke();
    ctx.fillStyle = bannerColor(enemy);
    const wv2 = Math.sin(T*2.8 + 1.4) * 2.5 * z;
    ctx.beginPath(); ctx.moveTo(K[0], K[1] - 20*z); ctx.lineTo(K[0] + 15*z + wv2, K[1] - 16*z);
    ctx.lineTo(K[0], K[1] - 11*z); ctx.closePath(); ctx.fill(); ctx.stroke();

  } else if (b.t === 'cannon'){
    isoBox(gx+0.1, gy+0.1, s-0.2, s-0.2, 12, C.stone, C.stoneD, '#77848f');
    const r = isoBox(gx+0.42, gy+0.42, 1.16, 1.16, 30, C.stoneL, C.stoneD, C.stone);
    const [px, py] = w2s(isoX(gx+s/2, gy+s/2), isoY(gx+s/2, gy+s/2));
    const top = py - 30*z;
    const ang = b.aim !== undefined ? b.aim : -0.5;
    const rec = b.recoil ? b.recoil * 6 * z : 0;
    ctx.save(); ctx.translate(px, top); ctx.rotate(ang);
    ctx.fillStyle = '#3f4a56'; ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.5, 2.4*z);
    ctx.beginPath(); roundRect(-7*z - rec, -6*z, 38*z, 12*z, 5*z); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5b6875';
    ctx.beginPath(); roundRect(-7*z - rec, -6*z, 38*z, 5*z, 3*z); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#3f4a56'; ctx.strokeStyle = C.line;
    ctx.beginPath(); ctx.ellipse(px, top + 3*z, 10*z, 7*z, 0, 0, 6.29); ctx.fill(); ctx.stroke();

  } else if (b.t === 'tower'){
    isoBox(gx+0.12, gy+0.12, s-0.24, s-0.24, 11, C.stone, C.stoneD, '#77848f');
    const th = 78 + lv*3;
    isoBox(gx+0.35, gy+0.35, 1.3, 1.3, th, C.stoneL, C.stoneD, C.stone);
    isoRoof(gx+0.18, gy+0.18, 1.64, 1.64, th, th + 36, enemy ? '#a03828' : '#3f6fbe', enemy ? '#6d2216' : '#2a4c88');
    const [px, py] = w2s(isoX(gx+s/2, gy+s/2), isoY(gx+s/2, gy+s/2));
    const top = py - th * z;
    ctx.fillStyle = '#1b2432';
    ctx.beginPath(); roundRect(px - 2.8*z, top + 22*z, 5.6*z, 13*z, 2.4*z); ctx.fill();

  } else if (b.t === 'wall'){
    const wh = 24 + lv * 2.2;
    isoBox(gx + 0.02, gy + 0.02, 0.96, 0.96, wh, '#96a3b0', '#54626e', '#74828e');
    const [px, py] = w2s(isoX(gx + 0.5, gy + 0.5), isoY(gx + 0.5, gy + 0.5));
    ctx.fillStyle = '#a9b6c2'; ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.1, 1.8 * z);
    ctx.beginPath(); roundRect(px - 5 * z, py - (wh + 9) * z, 10 * z, 10 * z, 2 * z); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(30,40,52,.35)'; ctx.lineWidth = Math.max(1, 1.5 * z);
    ctx.beginPath(); ctx.moveTo(px, py - wh * z + 8 * z); ctx.lineTo(px, py + 6 * z); ctx.stroke();
  }

  if (b.t !== 'wall'){
    const [px, py] = w2s(isoX(gx + s/2, gy + s/2), isoY(gx + s/2, gy + s/2));
    drawLevelPip(px, py - PIPH[b.t] * z, lv);
  }
  if (ghostAlpha !== undefined) ctx.restore();
}

function drawLevelPip(x, y, lv){
  const z = cam.z; if (z < 0.62) return;
  ctx.fillStyle = 'rgba(20,28,40,.86)'; ctx.strokeStyle = C.gold; ctx.lineWidth = Math.max(1, 1.6*z);
  ctx.beginPath(); roundRect(x - 9*z, y - 9*z, 18*z, 13*z, 5*z); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.parch; ctx.font = '900 ' + (9.5*z).toFixed(1) + 'px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(lv, x, y - 2.2*z);
}

function drawHpBar(x, y, w, ratio){
  const z = cam.z;
  ctx.fillStyle = 'rgba(10,14,22,.75)';
  ctx.beginPath(); roundRect(x - w/2, y, w, 5.5*z, 3*z); ctx.fill();
  ctx.fillStyle = ratio > 0.5 ? '#5fd06a' : ratio > 0.22 ? '#e8b23c' : '#e0503a';
  ctx.beginPath(); roundRect(x - w/2 + 1*z, y + 1*z, Math.max(0, (w - 2*z) * ratio), 3.5*z, 2*z); ctx.fill();
}


/* ============ troops ============ */
const TROOP = {
  raider: { n:'Raider', hp:130, dmg:16, cd:0.8,  spd:2.5, rng:0.85, sp:1, cost:{g:45,i:0},    tt:5,  pref:'any',  col:'#b4c3d2', col2:'#6b7a89' },
  lancer: { n:'Lancer', hp:380, dmg:24, cd:1.05, spd:1.7, rng:0.9,  sp:3, cost:{g:140,i:20},  tt:14, pref:'def',  col:'#7fa8e0', col2:'#3f6ba8' },
  archer: { n:'Archer', hp:95,  dmg:21, cd:0.7,  spd:2.1, rng:3.4,  sp:2, cost:{g:60,i:55},   tt:9,  pref:'any',  col:'#8fd67f', col2:'#4a8a44' },
  ram:    { n:'Ram',    hp:900, dmg:70, cd:1.5,  spd:1.25,rng:1.15, sp:6, cost:{g:120,i:190}, tt:22, pref:'wall', col:'#c48a4f', col2:'#7a4f28' }
};
const TROOP_UNLOCK = { raider:1, archer:1, lancer:2, ram:3 };  // barracks level needed

/* ============ state ============ */
let ST = null;
let uid = 1;

function freshState(){
  const s = {
    gold: 900, iron: 320, trophy: 0, stage: 1,
    buildings: [], army: { raider:0, lancer:0, archer:0, ram:0 },
    queue: [], done: [], claimed: [], raids: 0, wins: 0, built: 0, tutorial: false, lastSeen: Date.now()
  };
  const mid = Math.floor(N/2) - 1;
  s.buildings.push({ id: uid++, t:'keep', gx: mid, gy: mid, lv: 1, stock: 0 });
  s.buildings.push({ id: uid++, t:'mine', gx: mid - 3, gy: mid, lv: 1, stock: 0 });
  s.buildings.push({ id: uid++, t:'barr', gx: mid + 3, gy: mid, lv: 1, stock: 0 });
  return s;
}

const byId   = id => ST.buildings.find(b => b.id === id);
const keepB  = () => ST.buildings.find(b => b.t === 'keep');
const keepLv = () => { const k = keepB(); return k ? k.lv : 1; };
const countOf = t => ST.buildings.filter(b => b.t === t).length;
const capOf   = t => (CAP[t] ? CAP[t][Math.min(keepLv(), KEEP_MAX)] : 0);

function storeCap(){
  let c = 2500;
  ST.buildings.filter(b => b.t === 'store').forEach(b => c += CAPACITY(b.lv));
  return c;
}
function armyCap(){
  let c = 0;
  ST.buildings.filter(b => b.t === 'barr').forEach(b => c += 8 + b.lv * 6);
  return c;
}
function armyUsed(){
  let u = 0;
  for (const k in ST.army) u += ST.army[k] * TROOP[k].sp;
  ST.queue.forEach(q => u += TROOP[q.t].sp);
  return u;
}
function bestBarr(){
  let lv = 0; ST.buildings.forEach(b => { if (b.t === 'barr' && b.lv > lv) lv = b.lv; }); return lv;
}
function canAfford(c){ return ST.gold >= (c.g||0) && ST.iron >= (c.i||0); }
function pay(c){ ST.gold -= (c.g||0); ST.iron -= (c.i||0); }
function gain(g, i){
  const cap = storeCap();
  ST.gold = Math.min(cap, ST.gold + (g||0));
  ST.iron = Math.min(cap, ST.iron + (i||0));
}

/* ============ save / load ============ */
const KEY = 'ironvow_v1';
function save(){
  try { ST.lastSeen = Date.now(); localStorage.setItem(KEY, JSON.stringify(ST)); } catch(e){}
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s || !s.buildings || !s.buildings.length) return false;
    ST = s;
    ST.army   = ST.army   || { raider:0, lancer:0, archer:0, ram:0 };
    ST.queue  = ST.queue  || [];
    ST.done   = ST.done   || [];
    ST.claimed= ST.claimed|| [];
    uid = Math.max(...ST.buildings.map(b => b.id)) + 1;
    // offline production, capped at 4 hours
    const off = Math.min((Date.now() - (ST.lastSeen || Date.now())) / 1000, 14400);
    if (off > 30) tickProduction(off, true);
    return true;
  } catch(e){ return false; }
}

/* ============ production ============ */
function stockCapOf(b){ return (PROD[b.t] ? PROD[b.t](b.lv) : 0) * 12; }   // 12 minutes of buffer

function tickProduction(dt, silent){
  ST.buildings.forEach(b => {
    if (!PROD[b.t]) return;
    const cap = stockCapOf(b);
    b.stock = Math.min(cap, (b.stock || 0) + PROD[b.t](b.lv) * dt / 60);
  });
  if (silent){
    // offline collection is automatic so you never come back to a dead base
    ST.buildings.forEach(b => {
      if (!PROD[b.t]) return;
      if (b.t === 'mine') gain(b.stock, 0); else gain(0, b.stock);
      b.stock = 0;
    });
  }
}

function collect(b){
  if (!PROD[b.t] || (b.stock || 0) < 1) return false;
  const amt = Math.floor(b.stock);
  if (b.t === 'mine') gain(amt, 0); else gain(0, amt);
  b.stock = 0;
  ST.collected = (ST.collected || 0) + 1;
  popups.push({ x: b.gx + TYPES[b.t].s/2, y: b.gy + TYPES[b.t].s/2, txt: '+' + fmt(amt), col: b.t === 'mine' ? '#ffd25c' : '#c3d2e0', t: 0 });
  sfx.coin(); bump(b); return true;
}

const popups = [];
function bump(b){ b.bump = 1; }

/* ============ training queue ============ */
function tickQueue(dt){
  if (!ST.queue.length) return;
  const q = ST.queue[0];
  q.left -= dt;
  if (q.left <= 0){
    ST.army[q.t] = (ST.army[q.t] || 0) + 1;
    ST.trainedTotal = (ST.trainedTotal || 0) + 1;
    ST.queue.shift();
    sfx.tap();
  }
}
function trainTroop(t){
  const d = TROOP[t];
  if (bestBarr() < TROOP_UNLOCK[t]) { toast('Barracks level ' + TROOP_UNLOCK[t] + ' needed'); return; }
  if (armyUsed() + d.sp > armyCap()) { toast('Warband is full — upgrade or build a Barracks'); sfx.bad(); return; }
  if (!canAfford(d.cost)) { toast('Not enough resources'); sfx.bad(); return; }
  pay(d.cost);
  ST.queue.push({ t, left: d.tt });
  sfx.tap(); save(); renderArmy();
}

/* ============ placement ============ */
let mode = 'base';                    // 'base' | 'place' | 'battle'
let place = null;                     // { t, gx, gy, ok }

function cellsFree(t, gx, gy, ignoreId){
  const s = TYPES[t].s;
  if (gx < IN0 || gy < IN0 || gx + s > IN1 || gy + s > IN1) return false;
  for (const b of ST.buildings){
    if (ignoreId && b.id === ignoreId) continue;
    const bs = TYPES[b.t].s;
    if (gx < b.gx + bs && gx + s > b.gx && gy < b.gy + bs && gy + s > b.gy) return false;
  }
  return true;
}

function startPlace(t){
  const owned = countOf(t);
  if (owned >= capOf(t)) { toast(TYPES[t].n + ' limit reached — raise your Keep'); sfx.bad(); return; }
  const c = costOf(t, 0, owned);
  if (!canAfford(c)) { toast('Not enough resources'); sfx.bad(); return; }
  closeSheet();
  mode = 'place';
  const k = keepB();
  let gx = k.gx, gy = k.gy + 4;
  for (let r = 0; r < 80 && !cellsFree(t, gx, gy); r++){
    gx = clamp(k.gx + Math.round((Math.random()-0.5)*12), IN0, IN1 - TYPES[t].s);
    gy = clamp(k.gy + Math.round((Math.random()-0.5)*12), IN0, IN1 - TYPES[t].s);
  }
  place = { t, gx, gy, ok: cellsFree(t, gx, gy), moving: null };
  showPlaceBar();
}

// lift an existing building off the map and carry it
function startMove(b){
  deselect(); closeSheet();
  ST.buildings = ST.buildings.filter(x => x.id !== b.id);
  mode = 'place';
  place = { t: b.t, gx: b.gx, gy: b.gy, ok: true, moving: b, fromX: b.gx, fromY: b.gy };
  showPlaceBar();
}

function movePlaceTo(sx, sy){
  if (!place) return;
  const [gx, gy] = s2g(sx, sy);
  const s = TYPES[place.t].s;
  place.gx = clamp(Math.round(gx - s/2), IN0, IN1 - s);
  place.gy = clamp(Math.round(gy - s/2), IN0, IN1 - s);
  place.ok = cellsFree(place.t, place.gx, place.gy);
  showPlaceBar();
}

function confirmPlace(){
  if (!place) return;
  if (!place.ok) { toast('That spot is blocked'); sfx.bad(); return; }
  if (place.moving){
    const b = place.moving;
    b.gx = place.gx; b.gy = place.gy; b.bump = 1;
    ST.buildings.push(b);
    place.moving = null;          // hand is empty now — stop cancelPlace re-adding it
    sfx.place(); save(); cancelPlace(); return;
  }
  const t = place.t, owned = countOf(t), c = costOf(t, 0, owned);
  if (!canAfford(c)) { toast('Not enough resources'); sfx.bad(); return; }
  pay(c);
  ST.buildings.push({ id: uid++, t, gx: place.gx, gy: place.gy, lv: 1, stock: 0, bump: 1 });
  ST.built++;
  sfx.place(); save(); checkQuests();
  // ramparts keep the tool loaded so you can lay a run of them
  if (t === 'wall' && countOf(t) < capOf(t) && canAfford(costOf(t, 0, countOf(t)))){
    const nx = clamp(place.gx + 1, IN0, IN1 - 1);
    place = { t, gx: nx, gy: place.gy, ok: cellsFree(t, nx, place.gy), moving: null };
    showPlaceBar();
  } else cancelPlace();
}

function cancelPlace(){
  if (place && place.moving){          // put it back exactly where it was
    const b = place.moving;
    b.gx = place.fromX; b.gy = place.fromY;
    ST.buildings.push(b);
  }
  place = null; mode = 'base'; $('placeBar').classList.add('hide');
}

function showPlaceBar(){
  const el = $('placeBar'); el.classList.remove('hide');
  const moving = !!place.moving;
  el.innerHTML =
    '<div class="t">' + (moving ? 'Moving ' : '') + TYPES[place.t].n +
    '<em>' + (place.ok ? 'Drag it, or tap the ground to jump it there.' : 'Blocked — pick another spot.') + '</em></div>' +
    '<button class="btn grey" id="pCancel">CANCEL</button>' +
    '<button class="btn' + (place.ok ? '' : ' grey') + '" id="pOk">' + (moving ? 'DONE' : 'PLACE') + '</button>';
  $('pCancel').onclick = () => { sfx.tap(); cancelPlace(); };
  $('pOk').onclick = () => confirmPlace();
}

function buildingAt(sx, sy){
  const [gx, gy] = s2g(sx, sy);
  for (const b of ST.buildings){
    const s = TYPES[b.t].s;
    if (gx >= b.gx && gx < b.gx + s && gy >= b.gy && gy < b.gy + s) return b;
  }
  return null;
}

/* press-and-drag straight off the map, plus drag of the carried ghost */
function basePress(sx, sy){
  clearLongPress();
  if (mode === 'place'){
    const s = TYPES[place.t].s;
    const [gx, gy] = s2g(sx, sy);
    if (gx >= place.gx - 1 && gx < place.gx + s + 1 && gy >= place.gy - 1 && gy < place.gy + s + 1) dragActive = true;
    return;
  }
  if (mode !== 'base') return;
  const b = buildingAt(sx, sy);
  if (!b || b.t === 'keep') return;
  lpTimer = setTimeout(() => {
    if (!ptr.down || ptr.moved) return;
    sfx.tap(); startMove(b); dragActive = true;
    toast('Carrying the ' + TYPES[b.t].n + ' — drop it where you want');
  }, 300);
}

function baseDrag(sx, sy){ if (mode === 'place') movePlaceTo(sx, sy); }

/* ============ inspector ============ */
let selId = 0;
function selectB(b){
  selId = b.id;
  const el = $('insp'); el.classList.remove('hide');
  const d = TYPES[b.t], maxed = b.t === 'keep' ? b.lv >= KEEP_MAX : b.lv >= 9;
  const c = costOf(b.t, b.lv, 0);
  const afford = canAfford(c);
  let detail = d.blurb;
  if (PROD[b.t]) detail = Math.round(PROD[b.t](b.lv)) + '/min now → ' + Math.round(PROD[b.t](b.lv+1)) + '/min next';
  if (b.t === 'store') detail = 'Holds ' + fmt(storeCap()) + ' of each resource';
  if (b.t === 'barr')  detail = 'Warband room ' + armyUsed() + '/' + armyCap();
  if (DEF_STAT[b.t]){ const s = DEF_STAT[b.t](b.lv); detail = Math.round(s.dmg) + ' damage per shot · ' + s.rng.toFixed(1) + ' tile reach'; }
  if (b.t === 'keep')  detail = 'Level ' + b.lv + ' of ' + KEEP_MAX + ' · unlocks new buildings and higher limits';

  el.innerHTML =
    '<canvas id="ispIco" width="92" height="92"></canvas>' +
    '<div class="info"><h3>' + d.n + ' · LV ' + b.lv + '</h3><p>' + detail + '</p></div>' +
    '<div class="acts">' +
      (maxed ? '<button class="btn grey" disabled>MAX</button>'
             : '<button class="btn' + (afford ? '' : ' grey') + '" id="ispUp">' +
               'LV ' + (b.lv+1) + '<br><span style="font-size:9px">' +
               (c.g ? fmt(c.g) + 'g ' : '') + (c.i ? fmt(c.i) + 'i' : '') + '</span></button>') +
      (b.t === 'keep' ? '' : '<button class="btn grey" id="ispMove">MOVE</button>') +
    '</div>';
  drawMini($('ispIco'), b.t, b.lv);
  const up = $('ispUp');
  if (up) up.onclick = () => {
    if (b.t !== 'keep' && b.lv >= keepLv()) { toast('Cannot pass your Keep level — raise the Keep first'); sfx.bad(); return; }
    if (!canAfford(c)) { toast('Not enough resources'); sfx.bad(); return; }
    pay(c); b.lv++; b.bump = 1; sfx.up();
    toast(d.n + ' is now level ' + b.lv);
    save(); checkQuests(); selectB(b);
  };
  const mv = $('ispMove');
  if (mv) mv.onclick = () => { sfx.tap(); startMove(b); };
}

function deselect(){ selId = 0; $('insp').classList.add('hide'); }

/* ============ base tap ============ */
function baseTap(sx, sy){
  if (mode === 'place'){ movePlaceTo(sx, sy); return; }
  // collect bubbles first (they sit above the building)
  for (const b of ST.buildings){
    if (!PROD[b.t] || (b.stock||0) < 1) continue;
    const s = TYPES[b.t].s;
    const [bx, by] = w2s(isoX(b.gx + s/2, b.gy + s/2), isoY(b.gx + s/2, b.gy + s/2));
    const cy = by - (86 + Math.sin(T*2.6 + b.id) * 3) * cam.z;
    if (dist(sx, sy, bx, cy) < 26 * cam.z + 10){ collect(b); save(); checkQuests(); return; }
  }
  const [gx, gy] = s2g(sx, sy);
  for (const b of ST.buildings){
    const s = TYPES[b.t].s;
    if (gx >= b.gx && gx < b.gx + s && gy >= b.gy && gy < b.gy + s){ sfx.tap(); selectB(b); return; }
  }
  deselect();
}

/* ============ base render ============ */
function drawCollectBubble(b){
  const z = cam.z, s = TYPES[b.t].s;
  const [bx, by] = w2s(isoX(b.gx + s/2, b.gy + s/2), isoY(b.gx + s/2, b.gy + s/2));
  const cy = by - (86 + Math.sin(T*2.6 + b.id) * 3) * z;
  ctx.fillStyle = 'rgba(20,28,40,.9)'; ctx.strokeStyle = C.gold; ctx.lineWidth = Math.max(1.4, 2.2*z);
  ctx.beginPath(); ctx.ellipse(bx, cy, 15*z, 15*z, 0, 0, 6.29); ctx.fill(); ctx.stroke();
  if (b.t === 'mine'){
    ctx.fillStyle = C.gold; ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, 1.6*z);
    for (let i = 0; i < 3; i++){
      ctx.beginPath(); ctx.ellipse(bx - 5*z + i*5*z, cy + 3*z - i*2.5*z, 4*z, 2.8*z, 0, 0, 6.29); ctx.fill(); ctx.stroke();
    }
  } else {
    ctx.fillStyle = '#c3d2e0'; ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, 1.6*z);
    ctx.beginPath(); ctx.moveTo(bx-7*z, cy+4*z); ctx.lineTo(bx-4*z, cy-4*z); ctx.lineTo(bx+4*z, cy-4*z);
    ctx.lineTo(bx+7*z, cy+4*z); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(bx - 5*z, cy + 13*z); ctx.lineTo(bx, cy + 21*z); ctx.lineTo(bx + 5*z, cy + 13*z);
  ctx.fillStyle = 'rgba(20,28,40,.9)'; ctx.fill();
}

function drawPopups(dt){
  for (let i = popups.length - 1; i >= 0; i--){
    const p = popups[i]; p.t += dt;
    if (p.t > 1.3){ popups.splice(i, 1); continue; }
    const [px, py] = w2s(isoX(p.x, p.y), isoY(p.x, p.y));
    ctx.globalAlpha = clamp(1 - p.t / 1.3, 0, 1);
    ctx.fillStyle = p.col; ctx.strokeStyle = C.line; ctx.lineWidth = 3.2;
    ctx.font = '900 ' + (16 * cam.z).toFixed(0) + 'px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const y = py - 60 * cam.z - p.t * 34;
    ctx.strokeText(p.txt, px, y); ctx.fillText(p.txt, px, y);
    ctx.globalAlpha = 1;
  }
}

function renderBase(dt){
  drawTerrain();
  const ents = [];
  TER.deco.forEach(d => { if (onScreen(d.gx, d.gy)) ents.push({ d: d.gx + d.gy, kind:'deco', o:d }); });
  ST.buildings.forEach(b => ents.push({ d: b.gx + b.gy + TYPES[b.t].s * 0.5, kind:'b', o:b }));
  ents.sort((a, z) => a.d - z.d);

  if (place){
    // footprint marker under the ghost
    isoDiamond(place.gx, place.gy, TYPES[place.t].s, TYPES[place.t].s,
      place.ok ? 'rgba(90,220,110,.35)' : 'rgba(230,70,50,.35)', 0,
      place.ok ? '#8fe07a' : '#ff7a63');
  }

  ents.forEach(e => {
    if (e.kind === 'deco') return drawDeco(e.o);
    const b = e.o;
    ctx.save();
    if (b.bump){
      b.bump = Math.max(0, b.bump - dt * 3);
      const k = 1 + Math.sin(b.bump * Math.PI) * 0.09;
      const s = TYPES[b.t].s;
      const [cx, cy] = w2s(isoX(b.gx + s/2, b.gy + s/2), isoY(b.gx + s/2, b.gy + s/2));
      ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
    }
    drawBuilding(b, false);
    ctx.restore();
    if (b.id === selId){
      isoDiamond(b.gx, b.gy, TYPES[b.t].s, TYPES[b.t].s, 'rgba(232,178,60,.2)', 0, C.gold);
    }
  });

  if (place) drawBuilding({ t: place.t, gx: place.gx, gy: place.gy, lv: 1 }, false, 0.55);
  ST.buildings.forEach(b => { if (PROD[b.t] && (b.stock||0) >= 1) drawCollectBubble(b); });
  drawPopups(dt);
}

/* ============ flat mini icons for cards ============ */
function drawMini(cv, t, lv){
  const g = cv.getContext('2d'), w = cv.width, h = cv.height;
  g.clearRect(0, 0, w, h); g.save(); g.translate(w/2, h/2);
  const k = w / 92;
  g.lineJoin = 'round'; g.lineWidth = 3 * k; g.strokeStyle = C.line;
  const box = (x, y, bw, bh, top, side) => {
    g.fillStyle = side; g.beginPath(); g.rect((x-bw/2)*k, y*k, bw*k, bh*k); g.fill(); g.stroke();
    g.fillStyle = top;  g.beginPath(); g.rect((x-bw/2)*k, y*k, bw*k, 7*k);  g.fill(); g.stroke();
  };
  if (t === 'keep'){
    box(-14, -6, 14, 30, C.stoneL, C.stone); box(14, -6, 14, 30, C.stoneL, C.stone);
    box(0, -18, 22, 42, C.stoneL, C.stone);
    g.fillStyle = '#3f7fd6'; g.beginPath(); g.moveTo(0, -34*k); g.lineTo(20*k, -30*k); g.lineTo(0, -24*k); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = C.line; g.beginPath(); g.moveTo(0, -34*k); g.lineTo(0, -16*k); g.stroke();
  } else if (t === 'mine'){
    box(0, -4, 30, 28, C.wood, '#6b4526');
    g.strokeStyle = C.woodD; g.lineWidth = 5*k; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-13*k, -4*k); g.lineTo(0, -28*k); g.lineTo(13*k, -4*k); g.stroke();
    g.fillStyle = C.gold; g.strokeStyle = C.line; g.lineWidth = 2.5*k;
    [[-8,16],[0,13],[8,16]].forEach(p => { g.beginPath(); g.ellipse(p[0]*k, p[1]*k, 6*k, 4.5*k, 0, 0, 6.29); g.fill(); g.stroke(); });
  } else if (t === 'forge'){
    box(0, -2, 32, 26, '#a8927c', '#6b5a49');
    box(-11, -22, 10, 24, C.stoneL, C.stone);
    g.fillStyle = 'rgba(190,200,212,.55)';
    [[-11,-32,6],[-8,-40,5],[-13,-46,4]].forEach(p => { g.beginPath(); g.arc(p[0]*k, p[1]*k, p[2]*k, 0, 6.29); g.fill(); });
    g.fillStyle = '#ff8c28'; g.beginPath(); g.ellipse(8*k, 12*k, 8*k, 5*k, 0, 0, 6.29); g.fill();
  } else if (t === 'store'){
    box(0, -8, 34, 32, C.wood, '#6b4526');
    g.strokeStyle = C.gold; g.lineWidth = 4*k;
    g.beginPath(); g.moveTo(-17*k, 2*k); g.lineTo(17*k, 2*k); g.stroke();
    g.fillStyle = C.gold; g.strokeStyle = C.line; g.lineWidth = 2.5*k;
    g.beginPath(); g.arc(0, 4*k, 6*k, 0, 6.29); g.fill(); g.stroke();
  } else if (t === 'barr'){
    g.fillStyle = '#d9c9a4'; g.strokeStyle = C.line; g.lineWidth = 3*k;
    g.beginPath(); g.moveTo(-30*k, 16*k); g.lineTo(0, -26*k); g.lineTo(30*k, 16*k); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#8c5f39'; g.beginPath(); g.rect(-9*k, 0, 18*k, 16*k); g.fill(); g.stroke();
    g.strokeStyle = C.woodD; g.lineWidth = 4*k; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-22*k, 16*k); g.lineTo(-17*k, -8*k); g.stroke();
  } else if (t === 'cannon'){
    box(0, 2, 32, 20, C.stoneL, C.stone);
    g.save(); g.translate(0, -4*k); g.rotate(-0.42);
    g.fillStyle = '#3f4a56'; g.beginPath(); g.rect(-8*k, -7*k, 34*k, 14*k); g.fill(); g.stroke(); g.restore();
    g.fillStyle = '#3f4a56'; g.beginPath(); g.arc(0, -2*k, 9*k, 0, 6.29); g.fill(); g.stroke();
  } else if (t === 'tower'){
    box(0, -8, 22, 34, C.stoneL, C.stone);
    g.fillStyle = '#2f5fa8'; g.beginPath(); g.moveTo(-19*k, -8*k); g.lineTo(0, -34*k); g.lineTo(19*k, -8*k); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#1b2432'; g.beginPath(); g.rect(-3*k, 2*k, 6*k, 12*k); g.fill();
  } else if (t === 'wall'){
    box(0, 0, 34, 24, C.stoneL, C.stone);
    g.strokeStyle = C.stoneD; g.lineWidth = 2.5*k;
    g.beginPath(); g.moveTo(0, 7*k); g.lineTo(0, 24*k); g.moveTo(-17*k, 15*k); g.lineTo(17*k, 15*k); g.stroke();

function drawTroopMini(cv, t){
  const g = cv.getContext('2d'), w = cv.width;
  const d = TROOP[t], k = w / 68;
  g.clearRect(0, 0, w, cv.height); g.save(); g.translate(w/2, cv.height/2);
  g.lineJoin = 'round'; g.lineWidth = 2.6*k; g.strokeStyle = C.line;
  // body
  g.fillStyle = d.col2; g.beginPath(); roundRectG(g, -9*k, -4*k, 18*k, 20*k, 6*k); g.fill(); g.stroke();
  // head
  g.fillStyle = d.col; g.beginPath(); g.arc(0, -12*k, 8*k, 0, 6.29); g.fill(); g.stroke();
  if (t === 'raider'){
    g.strokeStyle = '#8d9aa8'; g.lineWidth = 4*k; g.lineCap = 'round';
    g.beginPath(); g.moveTo(11*k, 10*k); g.lineTo(19*k, -12*k); g.stroke();
  } else if (t === 'lancer'){
    g.strokeStyle = C.woodD; g.lineWidth = 3.4*k; g.lineCap = 'round';
    g.beginPath(); g.moveTo(13*k, 16*k); g.lineTo(13*k, -22*k); g.stroke();
    g.fillStyle = '#c9d6e4'; g.strokeStyle = C.line; g.lineWidth = 2*k;
    g.beginPath(); g.moveTo(13*k, -28*k); g.lineTo(17*k, -19*k); g.lineTo(9*k, -19*k); g.closePath(); g.fill(); g.stroke();
  } else if (t === 'archer'){
    g.strokeStyle = C.woodD; g.lineWidth = 3*k;
    g.beginPath(); g.arc(13*k, 0, 13*k, -1.1, 1.1); g.stroke();
  } else {
    g.fillStyle = C.wood; g.strokeStyle = C.line; g.lineWidth = 2.6*k;
    g.beginPath(); roundRectG(g, -18*k, -6*k, 36*k, 13*k, 5*k); g.fill(); g.stroke();
    g.fillStyle = '#3f4a56'; g.beginPath(); g.arc(-19*k, 0, 5*k, 0, 6.29); g.fill(); g.stroke();
  }
  g.restore();
}
function roundRectG(g, x, y, w, h, r){
  g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r);
  g.arcTo(x+w, y+h, x, y+h, r); g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath();
}
